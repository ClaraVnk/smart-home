- id: clim_off_fenetre_salon
  alias: Clim auto-off - Salon fenêtre ouverte (radiateur + Daikin)
  description: Coupe les climates actives de Salon quand fenêtre ouverte > 5 min. Daikin → turn_off natif. Atlantic Netatmo → preset frost_guard (7°C, évite l'erreur 403 Netatmo causée par climate.turn_off sur les radiateurs Cozytouch).
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.salon_fenetre_ouverture
    - binary_sensor.salon_baie_vitree_ouverture
    to: 'on'
    for:
      minutes: 5
  action:
  - variables:
      actifs: '{% set out = namespace(l=[]) %}{% for e in [''climate.salon_2'', ''climate.daikinap50458_room_temperature''] %}  {% set s = states[e] %}  {% if s and s.state not in [''off'',''unavailable'',''unknown''] %}    {% set ha = s.attributes.hvac_action %}    {% if ha is none or ha in [''heating'',''cooling'',''drying''] %}      {% set out.l = out.l + [e] %}    {% endif %}  {% endif %}{% endfor %}{{ out.l }}'
      actifs_daikin: '{{ actifs | select(''eq'',''climate.daikinap50458_room_temperature'') | list }}'
      actifs_atlantic: '{{ actifs | reject(''eq'',''climate.daikinap50458_room_temperature'') | list }}'
  - condition: template
    value_template: '{{ actifs | length > 0 }}'
  - if:
    - condition: template
      value_template: '{{ actifs_daikin | length > 0 }}'
    then:
    - action: climate.turn_off
      target:
        entity_id: '{{ actifs_daikin }}'
  - if:
    - condition: template
      value_template: '{{ actifs_atlantic | length > 0 }}'
    then:
    - action: climate.set_preset_mode
      target:
        entity_id: '{{ actifs_atlantic }}'
      data:
        preset_mode: frost_guard
  - action: notify.iphones
    data:
      message: '❄️ Salon — fenêtre ouverte > 5 min, {{ actifs | length }} clim/radiateur(s) coupé(s) : {% for e in actifs %}{{ state_attr(e, ''friendly_name'') or e }}{{ '', '' if not loop.last }}{% endfor %}.'
