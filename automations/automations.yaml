- id: lit_dim_nuit
  alias: Lit - dimmer auto 5% la nuit (00h-07h)
  description: Quand la lampe lit s'allume entre minuit et 7h, force 5% de luminosité
  trigger:
  - platform: state
    entity_id: light.lit
    from: 'off'
    to: 'on'
  condition:
  - condition: time
    after: 00:00:00
    before: 07:00:00
  action:
  - delay:
      seconds: 1
  - action: light.turn_on
    target:
      entity_id: light.lit
    data:
      brightness_pct: 5
  mode: single
- id: notif_fumee_critical
  alias: Notif - Fumée (critique + répétition 2 min)
  description: Alerte critique répétée tant que fumée détectée
  trigger:
  - platform: state
    entity_id: binary_sensor.detecteur_de_fumee_fumee
    to: 'on'
  action:
  - repeat:
      while:
      - condition: state
        entity_id: binary_sensor.detecteur_de_fumee_fumee
        state: 'on'
      sequence:
      - action: notify.iphones
        data:
          message: 🚨 FUMÉE DÉTECTÉE — alerte au feu !
          data:
            push:
              sound: default
              interruption-level: critical
      - delay:
          minutes: 2
  mode: restart
