- id: notif_vacuum_erreur
  alias: Notif - Robot aspirateur en erreur / coincé
  description: Couvre état error, code erreur aspirateur (coincé/bumper/cliff/etc) et erreur dock. time-sensitive. Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
  trigger:
  - platform: state
    entity_id: vacuum.s8_pro_ultra
    to: error
  - platform: state
    entity_id: sensor.s8_pro_ultra_erreur_de_l_aspirateur
    for:
      seconds: 20
  - platform: state
    entity_id: sensor.s8_pro_ultra_erreur_de_dock
    for:
      seconds: 20
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: template
    value_template: "{{ is_state('vacuum.s8_pro_ultra','error')\n   or (states('sensor.s8_pro_ultra_erreur_de_l_aspirateur') not in ['none','unknown','unavailable',''])\n   or (states('sensor.s8_pro_ultra_erreur_de_dock') not in ['ok','unknown','unavailable','']) }}\n"
  - condition: template
    value_template: '{{ trigger.platform == ''time'' or trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  - condition: state
    entity_id: vacuum.s8_pro_ultra
    state: error
  action:
  - action: notify.iphones
    data:
      title: 🤖 Roborock
      message: '❌ Problème robot : {% set e = states(''sensor.s8_pro_ultra_erreur_de_l_aspirateur'') %}{% set d = states(''sensor.s8_pro_ultra_erreur_de_dock'') %}{% if e not in [''none'',''unknown'',''unavailable'',''''] %}{{ e }}{% elif d not in [''ok'',''unknown'',''unavailable'',''''] %}dock {{ d }}{% else %}en erreur{% endif %} — intervention requise.'
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
