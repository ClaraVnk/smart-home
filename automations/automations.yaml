- id: notif_filtre_purificateur_chambre
  alias: Notif - filtre purificateur chambre
  description: Filtre du Core 200S (chambre parentale) sous 15% restant.
  trigger:
  - platform: numeric_state
    entity_id: sensor.core_200s_series_filter_lifetime
    below: 15
  condition: []
  action:
  - action: notify.iphones
    data:
      title: 🔧 Purificateur chambre
      message: ⚠️ Changer le filtre du purificateur d'air de la chambre.
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: purificateur_chambre_pilotage_co2
  alias: Purificateur chambre - pilotage CO2 / mode nuit
  description: >-
    Jour (8h-19h) : vitesse selon le CO2 Netatmo de la chambre (33/66/100%).
    Nuit (19h-8h, coucher bébé) : preset sleep (silencieux).
    N'agit que si le purificateur est allumé (ne le rallume pas tout seul).
  trigger:
  - platform: state
    entity_id: sensor.weather_station_chambre_dioxyde_de_carbone
  - platform: time
    at: '19:00:00'
  - platform: time
    at: '08:00:00'
  - platform: state
    entity_id: fan.core_200s_series
    attribute: preset_mode
  - platform: state
    entity_id: fan.core_200s_series
    to: 'on'
  condition:
  - condition: state
    entity_id: fan.core_200s_series
    state: 'on'
  action:
  - variables:
      co2: "{{ states('sensor.weather_station_chambre_dioxyde_de_carbone') | float(0) }}"
      is_night: "{{ now().hour >= 19 or now().hour < 8 }}"
      current_preset: "{{ state_attr('fan.core_200s_series','preset_mode') }}"
      current_pct: "{{ state_attr('fan.core_200s_series','percentage') | int(-1) }}"
      target_pct: "{% if co2 < 800 %}33{% elif co2 <= 1100 %}66{% else %}100{% endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: "{{ is_night }}"
      sequence:
      - condition: template
        value_template: "{{ current_preset != 'sleep' }}"
      - action: fan.set_preset_mode
        target:
          entity_id: fan.core_200s_series
        data:
          preset_mode: sleep
    default:
    - condition: template
      value_template: "{{ current_preset == 'sleep' or (current_pct - (target_pct | int)) | abs > 5 }}"
    - action: fan.set_percentage
      target:
        entity_id: fan.core_200s_series
      data:
        percentage: "{{ target_pct | int }}"
  mode: single
- id: bambu_spaghetti_check
  alias: Bambu A1 mini - détection spaghetti via Claude
  description: Pendant impression (uniquement), capture la caméra A1 mini toutes les
    30 min et envoie à Claude pour analyse visuelle. Notif actionnable si échec détecté.
  trigger:
  - platform: time_pattern
    minutes: /30
  condition:
  - condition: state
    entity_id: sensor.a1mini_0300da610200644_etat_de_l_impression
    state: running
  - condition: numeric_state
    entity_id: sensor.a1mini_0300da610200644_progression_de_l_impression
    above: 0
    below: 100
  action:
  - action: camera.snapshot
    target:
      entity_id: camera.a1mini_0300da610200644_camera
    data:
      filename: /media/bambu_check.jpg
  - delay:
      seconds: 2
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.claude_ai_task
      task_name: bambu_spaghetti
      instructions: 'Tu es l''assistant maison de Kevin. Analyse cette image d''une
        impression 3D en cours sur la Bambu Lab A1 mini.

        Détecte tout problème visible : spaghetti (fil emmêlé en hauteur), désadhésion
        plateau (objet décollé), sous-extrusion, blob excessif, couche manquée, déformation
        visible.


        Réponds STRICTEMENT au format suivant (une seule ligne) :

        STATUS=ok|warn|fail | DETAIL=<phrase courte en français>


        Exemples :

        STATUS=ok | DETAIL=Impression en cours, aspect normal.

        STATUS=warn | DETAIL=Léger défaut sur le bord droit, à surveiller.

        STATUS=fail | DETAIL=Spaghetti détecté, l''objet est décollé du plateau.

        '
      attachments:
      - media_content_id: media-source://media_source/local/bambu_check.jpg
        media_content_type: image/jpeg
    response_variable: ai
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ai.data | regex_search(''STATUS\s*=\s*FAIL'', ignorecase=True) }}'
      sequence:
      - action: notify.iphones
        data:
          title: '🚨 Bambu A1 mini : impression compromise'
          message: '{{ ai.data }}'
          data:
            push:
              sound: default
              interruption-level: time-sensitive
            actions:
            - action: BAMBU_PAUSE
              title: ⏸ Mettre en pause
            - action: BAMBU_CANCEL
              title: 🛑 Annuler
    - conditions:
      - condition: template
        value_template: '{{ ai.data | regex_search(''STATUS\s*=\s*WARN'', ignorecase=True) }}'
      sequence:
      - action: notify.iphones
        data:
          title: '⚠️ Bambu A1 mini : à surveiller'
          message: '{{ ai.data }}'
  mode: single
- id: action_bambu_pause_claude
  alias: Action - Pause Bambu (depuis notif Claude)
  description: Bouton "Mettre en pause" de la notif spaghetti Bambu.
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: BAMBU_PAUSE
  action:
  - action: button.press
    target:
      entity_id: button.a1mini_0300da610200644_pause
  - action: notify.iphones
    data:
      message: ⏸ Bambu A1 mini mise en pause.
  mode: single
- id: action_bambu_cancel_claude
  alias: Action - Annuler Bambu (depuis notif Claude)
  description: Bouton "Annuler" de la notif spaghetti Bambu.
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: BAMBU_CANCEL
  action:
  - action: button.press
    target:
      entity_id: button.a1mini_0300da610200644_arret
  - action: notify.iphones
    data:
      message: 🛑 Bambu A1 mini annulée.
  mode: single
