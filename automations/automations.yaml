- id: tv_frame_wake_on_presence
  alias: TV Frame - Réveil sur présence (Hue entrée / FP300 cuisine / G4 person AI)
  description: Mouvement Hue entrée, présence FP300 cuisine, ou personne détectée AI G4 salon. Au moins 1 personne home + Frame off. turn_on simple (PAS de play_media art pour éviter bug Tizen)
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.detecteur_entree_mouvement
    - binary_sensor.aqara_presence_multisensor_fp300_occupation
    - binary_sensor.g4_instant_person_detected
    to: 'on'
  condition:
  - condition: time
    after: 06:30:00
    before: '23:00:00'
  - condition: state
    entity_id: media_player.55_the_frame
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  action:
  - action: media_player.turn_on
    target:
      entity_id: media_player.55_the_frame
  mode: single
- id: tv_frame_arrivee_mode_art
  alias: TV Frame - Mode Art à l'arrivée (1er du foyer)
  description: Quand Kevin ou Loutre arrive (géoloc not_home → home) ET qu'aucun autre n'était déjà home → allume la TV + mode Art. Skip si quelqu'un est déjà à la maison.
  trigger:
  - platform: state
    entity_id:
    - person.kevin_allioli
    - person.loutre
    from: not_home
    to: home
  condition:
  - condition: template
    value_template: '{{ ([states(''person.kevin_allioli''), states(''person.loutre'')] | select(''eq'',''home'') | list | count) == 1 }}

      '
  - condition: state
    entity_id: media_player.55_the_frame
    state: 'off'
  action:
  - action: media_player.turn_on
    target:
      entity_id: media_player.55_the_frame
  - delay: 00:00:05
  - action: media_player.play_media
    target:
      entity_id: media_player.55_the_frame
    data:
      media_content_id: art
      media_content_type: channel
  mode: single
- id: tv_frame_off_absence_3min
  alias: TV Frame - Coupure complète absence > 3 min
  description: Les 2 personnes not_home depuis 3 min → media_player.turn_off
  trigger:
  - platform: state
    entity_id:
    - person.kevin_allioli
    - person.loutre
    to: not_home
    for:
      minutes: 3
  condition:
  - condition: state
    entity_id: person.kevin_allioli
    state: not_home
  - condition: state
    entity_id: person.loutre
    state: not_home
  action:
  - action: media_player.turn_off
    target:
      entity_id: media_player.55_the_frame
  mode: single
- id: notif_tesla_low_battery
  alias: Notif - Tesla batterie faible
  description: 'Tesla < 25% et câble non branché : notif (à tout moment) Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.'
  trigger:
  - platform: numeric_state
    entity_id: sensor.josette_niveau_de_batterie
    below: 25
    for:
      minutes: 5
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: state
    state: 'off'
    entity_id: binary_sensor.josette_charge_cable
  - condition: template
    value_template: '{{ trigger.platform == ''time'' or trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  - condition: numeric_state
    entity_id: sensor.josette_niveau_de_batterie
    below: 25
  action:
  - action: notify.iphones
    data:
      message: 🔋 Tesla à {{ states('sensor.josette_niveau_de_batterie') }}% — pensez à brancher ce soir.
  mode: single
- id: notif_fenetre_ouverte_chauffage
  alias: Notif - Fenêtre ouverte + clim/chauffage
  description: Notifie quand une fenêtre/baie est ouverte plus de 5 min pendant que le chauffage tourne
  trigger:
  - platform: state
    entity_id:
    - binary_sensor.salon_fenetre_ouverture
    - binary_sensor.salon_baie_vitree_ouverture
    - binary_sensor.cuisine_fenetre_ouverture
    - binary_sensor.bureau_fenetre_ouverture
    - binary_sensor.raphael_fenetre_ouverture
    to: 'on'
    for:
      minutes: 3
  condition:
  - condition: template
    value_template: "{{ expand('climate.daikinap50458_room_temperature','climate.salon_2','climate.entree','climate.chambre','climate.bureau','climate.chambre_damis','climate.cuisine')\n   | rejectattr('state','in', ['off','unavailable','unknown'])\n   | selectattr('attributes.hvac_action','in', ['heating','cooling','drying'])\n   | list | count > 0 }}"
  action:
  - action: notify.iphones
    data:
      message: "{% set actives = expand('climate.daikinap50458_room_temperature','climate.salon_2','climate.entree','climate.chambre','climate.bureau','climate.chambre_damis','climate.cuisine')\n   | rejectattr('state','in', ['off','unavailable','unknown'])\n   | selectattr('attributes.hvac_action','in', ['heating','cooling','drying'])\n   | map(attribute='name') | list %}{% set what = (states.climate | rejectattr('state','in',['off','unavailable','unknown'])\n   | selectattr('attributes.hvac_action','eq','cooling')\n   | list | count > 0) %}{{ '❄️' if what else '\U0001F525' }} {{ trigger.to_state.attributes.friendly_name }} ouverte depuis 3 min — {{ 'la clim refroidit' if what else 'le chauffage tourne' }} ({{ actives | join(', ') }})."
  mode: single
- id: notif_volets_ouverts_nuit
  alias: Notif - Volets ouverts après 23h
  description: Rappelle de fermer les volets si encore ouverts à 23h
  trigger:
  - platform: time
    at: '23:00:00'
  condition:
  - condition: template
    value_template: "{{ expand('cover.salon_fenetre_volet_shutter','cover.cuisine_volet_shutter','cover.salon_baie_vitree_shutter','cover.raphael_volet_shutter')\n   | selectattr('state','eq','open') | list | count > 0 }}"
  action:
  - action: notify.iphones
    data:
      message: "\U0001F319 Volets toujours ouverts : {{ expand('cover.salon_fenetre_volet_shutter','cover.cuisine_volet_shutter','cover.salon_baie_vitree_shutter','cover.raphael_volet_shutter')\n   | selectattr('state','eq','open') | map(attribute='name') | join(', ') }}"
  mode: single
- id: notif_cafe_grains
  alias: Notif - Café plus assez de grains
  description: Niveau de grains bas. Fenêtre 7h-23h ; détection nocturne reportée au matin via un re-trigger à 7h00 (notifie si toujours bas).
  trigger:
  - platform: numeric_state
    entity_id: sensor.machine_a_cafe_niveau_de_grains
    below: 20
    for:
      minutes: 1
    id: live
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  - condition: template
    value_template: "{{ states('sensor.machine_a_cafe_niveau_de_grains') not in ['unavailable','unknown','none']\n   and states('sensor.machine_a_cafe_niveau_de_grains') | float(100) < 20 }}"
  action:
  - action: notify.iphones
    data:
      title: ☕ Machine à café
      message: 🫘 Plus assez de grains — remplis le réservoir.
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: notif_cafe_marc_plein
  alias: Notif - Café bac à marc plein
  description: Bac à marc plein. Anti-répétition via input_boolean.cafe_marc_signale. Fenêtre 7h-23h ; détection nocturne reportée à 7h (le tracking vide reste actif 24/7).
  trigger:
  - platform: numeric_state
    entity_id: sensor.machine_a_cafe_bac_a_marc
    above: 11
    for:
      minutes: 2
    id: plein
  - platform: numeric_state
    entity_id: sensor.machine_a_cafe_bac_a_marc
    below: 12
    id: vide
  - platform: time
    at: 07:00:00
    id: matin
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: vide
      sequence:
      - action: input_boolean.turn_off
        target:
          entity_id: input_boolean.cafe_marc_signale
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''plein'',''matin''] }}'
      - condition: state
        entity_id: input_boolean.cafe_marc_signale
        state: 'off'
      - condition: time
        after: 07:00:00
        before: '23:00:00'
      - condition: numeric_state
        entity_id: sensor.machine_a_cafe_bac_a_marc
        above: 11
      sequence:
      - action: notify.iphones
        data:
          title: ☕ Machine à café
          message: 🗑️ Bac à marc plein — à vider.
          data:
            push:
              sound: default
              interruption-level: time-sensitive
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.cafe_marc_signale
  mode: single
  condition:
  - condition: template
    value_template: '{{ trigger.platform == ''time'' or trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  - condition: numeric_state
    entity_id: sensor.machine_a_cafe_bac_a_marc
    above: 11
