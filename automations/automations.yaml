      message: 🔥 Consignes radiateurs montées de 2°C.
  mode: single
- id: notif_congelateur_trop_chaud
  alias: Notif - Congélateur trop chaud (>-15°C 1h)
  description: Alerte si le congélateur dépasse -15°C pendant plus d'une heure
  trigger:
  - platform: numeric_state
    entity_id: number.refrigerateur_freezer_temperature
    above: -15
    for:
      hours: 1
  action:
  - action: notify.iphones
    data:
      message: 🥶 Congélateur à {{ states('number.refrigerateur_freezer_temperature') }}°C depuis 1h — risque de décongélation.
      data:
        push:
          sound: default
          interruption-level: critical
  mode: single
- id: notif_tesla_charge_terminee
  alias: Notif - Tesla charge terminée
  trigger:
  - platform: state
    entity_id: sensor.josette_charging
    from: charging
    to: complete
  - platform: time
    at: 07:00:00
    id: matin
  action:
  - action: notify.iphones
    data:
      message: ✅ Tesla rechargée à {{ states('sensor.josette_niveau_de_batterie') }}%.
  mode: single
  condition:
  - condition: template
    value_template: '{{ trigger.platform == ''time'' or trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  - condition: state
    entity_id: sensor.josette_charging
    state: complete
  description: Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
- id: suggest_mode_vacances
  alias: Suggestion - Activer mode Vacances (absence > 24h)
  description: Si les 2 personnes sont not_home depuis plus de 24h, suggérer d'activer le mode Vacances
  trigger:
  - platform: state
    entity_id:
    - person.kevin_allioli
    - person.loutre
    to: not_home
    for:
      hours: 24
  condition:
  - condition: state
    entity_id: person.kevin_allioli
    state: not_home
  - condition: state
    entity_id: person.loutre
    state: not_home
  - condition: state
    entity_id: input_boolean.mode_vacances
    state: 'off'
  action:
  - action: notify.iphones
    data:
      message: 🏖️ Absence >24h détectée. Activer le mode Vacances (simulation présence) ?
      data:
        actions:
        - action: ACTIVATE_VACATION
          title: Activer Vacances
          activationMode: background
        - action: DISMISS_VACATION
          title: Ignorer
          activationMode: background
  mode: single
- id: action_activate_vacation
  alias: Action - Activer mode Vacances (depuis notif)
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: ACTIVATE_VACATION
  action:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.mode_vacances
  - action: notify.iphones
    data:
      message: 🏖️ Mode Vacances activé.
  mode: single
- id: volets_chaleur_journee
  alias: Volets - chaleur journée (12h-18h, T_ext > 28°C)
  description: >-
    Auto unifiée chaleur (fusion ex-`volets_chaleur_journee` + ex-`notif_meteo_chaud_extreme`).
    Déclenchement : T_ext > 28°C + 12h-18h + lux salon > 5000.
    Positions cibles des volets (mémorisées 2026-06-18) : baie 13, fenêtre salon 18, cuisine 20, raphael 19.
    Branches : (1) présent + baie/cuisine ouverte → notif anti-enfermement (CHALEUR_FERMER_VOLETS / CHALEUR_DISMISS), garde last_triggered > 30 min.
    (2) absent + 5 fenêtres fermées → volets aux positions + clim Daikin cool 20°C + notif info.
    (3) absent + une fenêtre ouverte → volets aux positions seuls + notif info (pas de clim).
    (4) défaut (présent + tout OK) → volets aux positions + lampes salon + glaçon + notif info.
    Anti-spam : skip si tous les volets sont déjà <= cible + 5 (= déjà fermés au plus près des positions mémorisées).
  trigger:
  - platform: numeric_state
    entity_id: sensor.weather_station_outdoor_module_temperature
    above: 28
    for:
      minutes: 10
  - platform: time_pattern
    minutes: /10
  condition:
  - condition: numeric_state
    entity_id: sensor.weather_station_outdoor_module_temperature
    above: 28
  - condition: time
    after: '12:00:00'
    before: '18:00:00'
  - condition: numeric_state
    entity_id: sensor.luminosite_salon_illuminance
    above: 5000
  - condition: template
    value_template: >-
      {{ (state_attr('cover.salon_baie_vitree_shutter','current_position')   | int(100)) > 13 + 5
         or (state_attr('cover.salon_fenetre_volet_shutter','current_position') | int(100)) > 18 + 5
         or (state_attr('cover.cuisine_volet_shutter','current_position')      | int(100)) > 20 + 5
         or (state_attr('cover.raphael_volet_shutter','current_position')      | int(100)) > 19 + 5 }}
  action:
  - choose:
    - conditions:
      - condition: or
        conditions:
        - condition: state
          entity_id: person.kevin_allioli
          state: home
        - condition: state
          entity_id: person.loutre
          state: home
      - condition: or
        conditions:
        - condition: state
          entity_id: binary_sensor.salon_baie_vitree_ouverture
          state: 'on'
        - condition: state
          entity_id: binary_sensor.cuisine_fenetre_ouverture
          state: 'on'
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 1800 }}
      sequence:
      - action: notify.iphones
        data:
          message: ☀️ {{ states("sensor.weather_station_outdoor_module_temperature") }}°C dehors mais baie-vitrée ou cuisine ouverte. Fermer volets + allumer ?
          data:
            actions:
            - action: CHALEUR_FERMER_VOLETS
              title: Fermer & allumer
              activationMode: background
            - action: CHALEUR_DISMISS
              title: Non merci
              activationMode: background
    - conditions:
      - condition: state
        entity_id: person.kevin_allioli
        state: not_home
      - condition: state
        entity_id: person.loutre
        state: not_home
      - condition: state
        entity_id: binary_sensor.salon_fenetre_ouverture
        state: 'off'
      - condition: state
        entity_id: binary_sensor.salon_baie_vitree_ouverture
        state: 'off'
      - condition: state
        entity_id: binary_sensor.cuisine_fenetre_ouverture
        state: 'off'
      - condition: state
        entity_id: binary_sensor.bureau_fenetre_ouverture
        state: 'off'
      - condition: state
        entity_id: binary_sensor.raphael_fenetre_ouverture
        state: 'off'
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.salon_baie_vitree_shutter
        data:
          position: 13
      - action: cover.set_cover_position
        target:
          entity_id: cover.salon_fenetre_volet_shutter
        data:
          position: 18
      - action: cover.set_cover_position
        target:
          entity_id: cover.cuisine_volet_shutter
        data:
          position: 20
      - action: cover.set_cover_position
        target:
          entity_id: cover.raphael_volet_shutter
        data:
          position: 19
      - action: climate.set_temperature
        target:
          entity_id: climate.daikinap50458_room_temperature
        data:
          hvac_mode: cool
          temperature: 20
      - action: notify.iphones
        data:
          message: ☀️ {{ states("sensor.weather_station_outdoor_module_temperature") }}°C dehors — appart vide, volets fermés (positions mémorisées) + clim Daikin 20°C.
    - conditions:
      - condition: state
        entity_id: person.kevin_allioli
        state: not_home
      - condition: state
        entity_id: person.loutre
        state: not_home
      sequence:
      - action: cover.set_cover_position
        target:
          entity_id: cover.salon_baie_vitree_shutter
        data:
          position: 13
      - action: cover.set_cover_position
        target:
          entity_id: cover.salon_fenetre_volet_shutter
        data:
          position: 18
      - action: cover.set_cover_position
        target:
          entity_id: cover.cuisine_volet_shutter
        data:
          position: 20
      - action: cover.set_cover_position
        target:
          entity_id: cover.raphael_volet_shutter
        data:
          position: 19
      - action: notify.iphones
        data:
          message: ☀️ {{ states("sensor.weather_station_outdoor_module_temperature") }}°C dehors — volets fermés (positions mémorisées). Clim non activée (fenêtre ouverte).
    default:
    - action: cover.set_cover_position
      target:
        entity_id: cover.salon_baie_vitree_shutter
      data:
        position: 13
    - action: cover.set_cover_position
      target:
        entity_id: cover.salon_fenetre_volet_shutter
      data:
        position: 18
    - action: cover.set_cover_position
      target:
        entity_id: cover.cuisine_volet_shutter
      data:
        position: 20
    - action: cover.set_cover_position
      target:
        entity_id: cover.raphael_volet_shutter
      data:
        position: 19
    - action: light.turn_on
      target:
        entity_id:
        - light.salon
        - light.lampe_glacon
    - action: notify.iphones
      data:
        message: ☀️ {{ states("sensor.weather_station_outdoor_module_temperature") }}°C dehors — volets fermés (positions mémorisées) + lampes salon allumées.
  mode: single
- id: action_chaleur_fermer_volets
  alias: Action - Fermer volets chaleur (depuis notif)
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: CHALEUR_FERMER_VOLETS
  action:
  - action: cover.set_cover_position
    target:
      entity_id: cover.salon_baie_vitree_shutter
    data:
      position: 13
  - action: cover.set_cover_position
    target:
      entity_id: cover.salon_fenetre_volet_shutter
    data:
      position: 18
  - action: cover.set_cover_position
    target:
      entity_id: cover.cuisine_volet_shutter
    data:
      position: 20
  - action: cover.set_cover_position
    target:
      entity_id: cover.raphael_volet_shutter
    data:
      position: 19
  - action: light.turn_on
    target:
      entity_id:
      - light.salon
      - light.lampe_glacon
  mode: single
- id: bridge_daikin_target_to_input
  alias: Bridge - Daikin target → input_number salon (Siri/UI)
  description: Quand l'utilisateur (ou Siri via HomeKit) change la consigne du Daikin, propage la valeur dans input_number.salon_target_temperature. L'automation salon_climate_setpoint_adjust prend ensuite le relais pour la calibration.
  trigger:
  - platform: state
    entity_id: climate.daikinap50458_room_temperature
    attribute: temperature
  condition:
  - condition: template
    value_template: '{% set u = trigger.context.user_id if trigger.context is defined else none %}{% set p = trigger.context.parent_id if trigger.context is defined else none %}{% set t = trigger.to_state.attributes.temperature if trigger.to_state and trigger.to_state.attributes else none %}{% set f = trigger.from_state.attributes.temperature if trigger.from_state and trigger.from_state.attributes else none %}{{ u is not none and p is none and t is not none and t != f }}'
  action:
  - action: input_number.set_value
    target:
      entity_id: input_number.salon_target_temperature
    data:
      value: '{{ trigger.to_state.attributes.temperature }}'
  mode: single
- id: notif_porte_frigo_ouverte_5min
  alias: Notif - Porte frigo/congélo ouverte > 5 min
  description: Alerte si la porte du combiné frigo+congélateur reste ouverte plus de 5 min
  trigger:
  - platform: state
    entity_id: binary_sensor.refrigerateur_porte
    to: 'on'
    for:
      minutes: 5
  action:
  - action: notify.iphones
    data:
      message: 🚪🥶 Porte du frigo/congélateur ouverte depuis 5 min — risque de décongélation.
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: anti_oubli_depart
  alias: Anti-oubli départ - fenêtres/portes ouvertes
  description: 'Quand tout le monde devient not_home : alerte si porte d''entrée ouverte (TOUJOURS) ou si une fenêtre est ouverte ET il fait < 15°C dehors (saison froide). En été, fenêtres ouvertes = comportement normal volets fermés, pas d''alerte.'
  trigger:
  - platform: state
    entity_id:
    - person.kevin_allioli
    - person.loutre
    to: not_home
    for:
      minutes: 2
  condition:
  - condition: state
    entity_id: person.kevin_allioli
    state: not_home
  - condition: state
    entity_id: person.loutre
    state: not_home
  - condition: template
    value_template: '{% set porte = is_state(''binary_sensor.entree_porte_ouverture'',''on'') %}{% set t_ext = states(''sensor.weather_station_outdoor_module_temperature'') | float(20) %}{% set fenetres = expand(''binary_sensor.salon_fenetre_ouverture'',''binary_sensor.salon_baie_vitree_ouverture'',''binary_sensor.cuisine_fenetre_ouverture'',''binary_sensor.bureau_fenetre_ouverture'',''binary_sensor.raphael_fenetre_ouverture'') | selectattr(''state'',''eq'',''on'') | list | count > 0 %}{{ porte or (fenetres and t_ext < 15) }}'
  action:
  - action: notify.iphones
    data:
      message: '🚨 ALERTE DÉPART : {% set ouv = expand(''binary_sensor.entree_porte_ouverture'',''binary_sensor.salon_fenetre_ouverture'',''binary_sensor.salon_baie_vitree_ouverture'',''binary_sensor.cuisine_fenetre_ouverture'',''binary_sensor.bureau_fenetre_ouverture'',''binary_sensor.raphael_fenetre_ouverture'') | selectattr(''state'',''eq'',''on'') | list %}{% for o in ouv %}{{ o.attributes.friendly_name or o.entity_id }}{{ '', '' if not loop.last }}{% endfor %}.'
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: notif_pluie_anticipation_shiva
  alias: Notif - Anticipation pluie pour Shiva
  description: Si pluie prévue dans les 2 prochaines heures et Shiva pas sorti depuis 2h, notifier
  trigger:
  - platform: time_pattern
    hours: /1
  condition:
  - condition: template
    value_template: '{{ (as_timestamp(now()) - as_timestamp(states("input_datetime.last_shiva_walk"))) / 3600 > 2 }}'
  - condition: time
    after: 07:00:00
    before: '22:00:00'
  action:
  - action: weather.get_forecasts
    target:
      entity_id: weather.forecast_maison
    data:
      type: hourly
    response_variable: forecast
  - if:
    - condition: template
      value_template: '{% set hours = forecast["weather.forecast_maison"].forecast[:2] %}{{ hours | selectattr("precipitation","gt",0.5) | list | count > 0 }}'
    then:
    - action: notify.iphones
      data:
        message: 🌧️🐕 Pluie prévue dans <2h — sors Shiva maintenant tant quil fait sec.
  mode: single
- id: notif_conso_anormale
  alias: Notif - Conso électrique anormale (>5 kW 10 min)
  description: Alerte si la puissance instantanée dépasse 5 kW pendant plus de 10 min
  trigger:
  - platform: numeric_state
    entity_id: sensor.lixee_papp
    above: 5000
    for:
      minutes: 10
  action:
  - action: notify.iphones
    data:
      message: '⚡ Conso anormale : {{ states("sensor.lixee_papp") }} W depuis 10 min — radiateur/four oublié ?'
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: mode_cinema_auto
  alias: Mode Cinéma auto - TV salon ON soir (transition off → on)
  description: TV passe physiquement de off à on (vraie mise en marche, pas bascule Art↔TV) après 19h → tamise Fauteuil + Lampe glaçon + Lampe d'ambiance
  trigger:
  - platform: state
    entity_id: media_player.55_the_frame
    from: 'off'
    to: 'on'
    for:
      seconds: 10
  condition:
  - condition: time
    after: '19:00:00'
    before: '23:59:59'
  action:
  - action: light.turn_on
    target:
      entity_id:
      - light.hue_play_1
      - light.lampe_glacon
      - light.lampe_dambiance
    data:
      brightness_pct: 30
      color_temp_kelvin: 2200
  mode: single
- id: motion_lighting_sdb
  alias: SDB - éclairage sur présence (couplé humidité)
  description: Allume sur mouvement. Coupe après 60s sans mouvement SI humidité < 58% (laisse la vapeur monter avant extinction, préserve l'éclairage pendant la douche).
  trigger:
  - platform: state
    entity_id: binary_sensor.detecteur_de_mouvement_sdb_occupation
    to: 'on'
    id: arrive
  - platform: state
    entity_id: binary_sensor.detecteur_de_mouvement_sdb_occupation
    to: 'off'
    for:
      seconds: 60
    id: leave
  - platform: numeric_state
    entity_id: sensor.temperature_humidity_bathroom_humidity
    below: 65
    for:
      minutes: 2
    id: humidity_drop
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: arrive
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.luminaire_sdb_3
    - conditions:
      - condition: trigger
        id: leave
      - condition: numeric_state
        entity_id: sensor.temperature_humidity_bathroom_humidity
        below: 58
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.luminaire_sdb_3
    - conditions:
      - condition: trigger
        id: humidity_drop
      - condition: state
        entity_id: binary_sensor.detecteur_de_mouvement_sdb_occupation
        state: 'off'
        for:
          seconds: 60
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.luminaire_sdb_3
  mode: restart
- id: motion_lighting_cuisine
  alias: Cuisine - éclairage sur présence
  description: Allume sur présence FP300 si lux < 250. Coupe après 2 min sans présence OU si la luminosité dépasse 320 lux (assez de jour, hystérésis 250/320).
  trigger:
  - platform: state
    entity_id: binary_sensor.aqara_presence_multisensor_fp300_occupation
    to: 'on'
    id: arrive
  - platform: state
    entity_id: binary_sensor.aqara_presence_multisensor_fp300_occupation
    to: 'off'
    for:
      minutes: 2
    id: leave
  - platform: numeric_state
    entity_id: sensor.aqara_presence_multisensor_fp300_eclairement
    above: 320
    for:
      minutes: 1
    id: assez_de_jour
  action:
  - choose:
    - conditions:
      - condition: trigger
        id: arrive
      - condition: numeric_state
        entity_id: sensor.aqara_presence_multisensor_fp300_eclairement
        below: 250
      sequence:
      - action: light.turn_on
        target:
          entity_id: light.plan_de_travail_6
    - conditions:
      - condition: trigger
        id: leave
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.plan_de_travail_6
    - conditions:
      - condition: trigger
        id: assez_de_jour
      - condition: state
        entity_id: light.plan_de_travail_6
        state: 'on'
      sequence:
      - action: light.turn_off
        target:
          entity_id: light.plan_de_travail_6
  mode: restart
- id: pi_entree_screen_wake
  alias: Pi entrée - réveil écran sur présence
  trigger:
  - platform: state
    entity_id: binary_sensor.detecteur_entree_mouvement
    to: 'on'
  action:
  - action: shell_command.pi_screen_wake
  mode: single
  description: Allume l'écran Pi entrée sur mouvement, MAIS PAS la nuit (23h-7h) sauf si la porte d'entrée vient d'être ouverte (= vraie présence humaine, pas le chat).
  condition:
  - condition: or
    conditions:
    - condition: time
      after: 07:00:00
      before: '23:00:00'
    - condition: template
      value_template: '{% set p = states.binary_sensor.entree_porte_ouverture %}{{ p is not none and (as_timestamp(now()) - as_timestamp(p.last_changed)) < 120 }}'
- id: pi_entree_screen_sleep
  alias: Pi entrée - mise en veille écran (2 min sans mouvement)
  trigger:
  - platform: state
    entity_id: binary_sensor.detecteur_entree_mouvement
    to: 'off'
    for:
      minutes: 2
  action:
  - action: shell_command.pi_screen_sleep
  mode: single
- id: tv_frame_art_remet_nuit_silencieuse
  alias: TV Frame - Retour Art Mode → restore ambiance Nuit silencieuse
  description: Quand la TV passe d'un contenu actif (HDMI/Netflix/etc) vers Art Mode en soirée, remet les 3 lampes salon en preset Nuit silencieuse
  trigger:
  - platform: state
    entity_id: sensor.55_the_frame_tv_channel_name
    to: art
  condition:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''art'', '''', ''unknown'', ''unavailable'', ''none''] }}'
  - condition: time
    after: '17:00:00'
    before: '23:59:59'
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  action:
  - action: light.turn_on
    target:
      entity_id: light.hue_play_1
    data:
      brightness_pct: 65
      xy_color:
      - 0.5068
      - 0.3702
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_dambiance
    data:
      brightness_pct: 65
      xy_color:
      - 0.4777
      - 0.3856
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_glacon
    data:
      brightness_pct: 20
      color_temp_kelvin: 2702
      transition: 3
  mode: single
- id: soir_ambiance_lampes
  alias: Soir - ambiance Nuit silencieuse (lampes basses quand luminosité baisse)
  description: Quand la luminosité salon baisse en soirée et quon est à la maison, allume Fauteuil + Lampe dambiance + Lampe glaçon en preset Hue Nuit silencieuse
  trigger:
  - platform: numeric_state
    entity_id: sensor.luminosite_salon_illuminance
    below: 15
    for:
      minutes: 5
  condition:
  - condition: time
    after: '17:00:00'
    before: '23:00:00'
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  action:
  - action: light.turn_on
    target:
      entity_id: light.hue_play_1
    data:
      brightness_pct: 65
      xy_color:
      - 0.5068
      - 0.3702
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_dambiance
    data:
      brightness_pct: 65
      xy_color:
      - 0.4777
      - 0.3856
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_glacon
    data:
      brightness_pct: 20
      color_temp_kelvin: 2702
      transition: 3
  mode: single
- id: volets_soir_global_v2
  alias: Volets - fermeture nuit global (élévation soleil < -8°)
  description: Ferme les volets quand le soleil est à -8° (= fin du crépuscule nautique = vraiment la nuit). Fin mai ~22:10, hiver ~17:30. Plus prédictible que lux, pas affecté par les montagnes qui font tomber le lux trop tôt.
  trigger:
  - platform: numeric_state
    entity_id: sun.sun
    attribute: elevation
    below: -8
    id: sun_dark
  condition:
  - condition: state
    entity_id: input_boolean.mode_nounou
    state: 'off'
  - condition: time
    after: '16:00:00'
    before: '23:30:00'
  action:
  - variables:
      volets:
      - cover.salon_baie_vitree_shutter
      - cover.salon_fenetre_volet_shutter
      - cover.cuisine_volet_shutter
      - cover.raphael_volet_shutter
      ouverts: '{{ expand(volets) | rejectattr(''state'', ''eq'', ''closed'') | map(attribute=''entity_id'') | list }}'
  - condition: template
    value_template: '{{ ouverts | length > 0 }}'
  - action: cover.close_cover
    target:
      entity_id: '{{ ouverts }}'
  mode: single
- id: chambre_interrupteur_hue_soir_on
  alias: Chambre - bouton ON Hue dimmer → ambiance soir
  description: Quand on appuie sur le bouton ON du Hue dimmer chambre en soirée, allume Bibliothèque + Lit en preset Nuit silencieuse + Lampe sel
  trigger:
  - platform: state
    entity_id: event.hue_dimmer_switch_1_bouton_1
    attribute: event_type
    to: short_release
  condition:
  - condition: time
    after: '19:00:00'
    before: '23:59:00'
  action:
  - action: light.turn_on
    target:
      entity_id: light.hue_go_1_2
    data:
      brightness_pct: 35
      xy_color:
      - 0.5068
      - 0.3702
      transition: 2
  - action: light.turn_on
    target:
      entity_id: light.lit
    data:
      brightness_pct: 10
      xy_color:
      - 0.5068
      - 0.3702
      transition: 2
  - action: switch.turn_on
    target:
      entity_id: switch.lampe_sel
  mode: single
- id: nuit_extinction_salon_absent
  alias: Nuit - extinction salon/cuisine/TV si plus de présence (22h-6h)
  description: Entre 22h et 6h, si aucune présence salon (G4) ET cuisine (FP300) depuis 10 min, bureau éteint et au moins une personne home → éteint salon/cuisine/TV
  trigger:
  - platform: state
    entity_id: binary_sensor.g4_instant_person_detected
    to: 'off'
    for:
      minutes: 10
  - platform: state
    entity_id: binary_sensor.aqara_presence_multisensor_fp300_occupation
    to: 'off'
    for:
      minutes: 10
  condition:
  - condition: state
    entity_id: binary_sensor.g4_instant_person_detected
    state: 'off'
  - condition: state
    entity_id: binary_sensor.aqara_presence_multisensor_fp300_occupation
    state: 'off'
  - condition: time
    after: '22:00:00'
    before: 06:00:00
  - condition: state
    entity_id: light.luminaire_bureau_5
    state: 'off'
  - condition: state
    entity_id: light.luminaire_toilettes_2
    state: 'off'
  - condition: state
    entity_id: light.luminaire_sdb_3
    state: 'off'
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  action:
  - action: light.turn_off
    target:
      entity_id:
      - light.salon
      - light.luminaire_cuisine_7
      - light.plan_de_travail_6
  - action: media_player.turn_off
    target:
      entity_id: media_player.television
  mode: single
- id: prusa_spaghetti_check
  alias: Prusa - détection spaghetti via Claude
  description: Pendant impression, capture caméra toutes les 30 min et envoie à Claude pour analyse visuelle. Notif actionnable si échec détecté.
  trigger:
  - platform: time_pattern
    minutes: /30
  condition:
  - condition: state
    entity_id: sensor.prusa_mk4s
    state: printing
  - condition: numeric_state
    entity_id: sensor.prusa_mk4s_avancement
    above: 0
    below: 100
  action:
  - action: camera.snapshot
    target:
      entity_id: camera.prusa_mk4s_buddy_cam
    data:
      filename: /media/prusa_check.jpg
  - delay:
      seconds: 2
  - action: ai_task.generate_data
    data:
      entity_id: ai_task.claude_ai_task
      task_name: prusa_spaghetti
      instructions: 'Tu es l''assistant maison de Kevin. Analyse cette image d''une impression 3D en cours sur la Prusa MK4S.

        Détecte tout problème visible : spaghetti (fil emmêlé en hauteur), désadhésion plateau (objet décollé),

        sous-extrusion, blob excessif, couche manquée, déformation visible.


        Réponds STRICTEMENT au format suivant (une seule ligne) :

        STATUS=ok|warn|fail | DETAIL=<phrase courte en français>


        Exemples :

        STATUS=ok | DETAIL=Impression en cours, aspect normal.

        STATUS=warn | DETAIL=Léger défaut sur le bord droit, à surveiller.

        STATUS=fail | DETAIL=Spaghetti détecté, l''objet est décollé du plateau.

        '
      attachments:
      - media_content_id: media-source://media_source/local/prusa_check.jpg
        media_content_type: image/jpeg
    response_variable: ai
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ ai.data | regex_search(''STATUS\s*=\s*FAIL'', ignorecase=True) }}'
      sequence:
      - action: notify.iphones
        data:
          title: '🚨 Prusa : impression compromise'
          message: '{{ ai.data }}'
          data:
            push:
              sound: default
              interruption-level: time-sensitive
            actions:
            - action: PRUSA_PAUSE
              title: ⏸ Mettre en pause
            - action: PRUSA_CANCEL
              title: 🛑 Annuler
    - conditions:
      - condition: template
        value_template: '{{ ai.data | regex_search(''STATUS\s*=\s*WARN'', ignorecase=True) }}'
      sequence:
      - action: notify.iphones
        data:
          title: '⚠️ Prusa : à surveiller'
          message: '{{ ai.data }}'
  mode: single
- id: action_prusa_pause_claude
  alias: Action - Pause Prusa (depuis notif Claude)
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: PRUSA_PAUSE
  action:
  - action: button.press
    target:
      entity_id: button.prusa_mk4s_mettre_en_pause_la_tache
  - action: notify.iphones
    data:
      message: ⏸ Prusa mise en pause.
  mode: single
- id: action_prusa_cancel_claude
  alias: Action - Annuler Prusa (depuis notif Claude)
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: PRUSA_CANCEL
  action:
  - action: button.press
    target:
      entity_id: button.prusa_mk4s_annuler_la_tache
  - action: notify.iphones
    data:
      message: 🛑 Prusa annulée.
  mode: single
- id: sdb_anti_extinction_douche
  alias: SDB - rallume immédiatement si extinction pendant douche
  description: Si la light SDB passe OFF alors que quelqu'un est dedans + humidité élevée (douche), rallume tout de suite.
  trigger:
  - platform: state
    entity_id: light.luminaire_sdb_3
    to: 'off'
  condition:
  - condition: numeric_state
    entity_id: sensor.temperature_humidity_bathroom_humidity
    above: 55
  - condition: state
    entity_id: binary_sensor.detecteur_de_mouvement_sdb_occupation
    state: 'on'
  action:
  - delay:
      seconds: 1
  - action: light.turn_on
    target:
      entity_id: light.luminaire_sdb_3
  mode: single
- id: notif_colis_livre
  alias: Notif - Colis livré
  description: Notif quand l'attribut delivered_today incrémente sur l'intégration Parcel Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
  trigger:
  - platform: state
    entity_id: sensor.parcel_app_parcel_active_shipment
    attribute: delivered_today
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: template
    value_template: '{% set new = trigger.to_state.attributes.delivered_today | int(0) %} {% set old = trigger.from_state.attributes.delivered_today | int(0) if trigger.from_state else 0 %} {{ new > old }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  action:
  - action: notify.iphones
    data:
      title: 📦 Colis livré
      message: Un colis vient d'être livré ({{ trigger.to_state.attributes.delivered_today }} aujourd'hui). Reste {{ trigger.to_state.attributes.number_of_active_parcels }} colis en cours.
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: notif_colis_jour_matin
  alias: Notif - Colis attendus aujourd'hui (8h)
  description: À 8h, si au moins 1 colis est prévu pour aujourd'hui, notifie
  trigger:
  - platform: time
    at: 08:00:00
  condition:
  - condition: numeric_state
    entity_id: sensor.parcel_app_parcel_active_shipment
    attribute: parcels_arriving_today
    above: 0
  action:
  - action: notify.iphones
    data:
      title: 📦 Livraisons prévues aujourd'hui
      message: '{{ state_attr(''sensor.parcel_app_parcel_active_shipment'',''parcels_arriving_today'') }} colis prévu(s) aujourd''hui. {%- set desc = state_attr(''sensor.parcel_app_parcel_active_shipment'',''full_description'') -%} {%- if desc %}\n→ {{ desc }}{% endif -%}'
  mode: single
- id: purificateur_pilotage_pollution
  alias: Purificateur - bascule auto/sleep selon pollution
  description: 'Si PM2.5 > 15 ou qualité non excellente → mode auto (le device gère la vitesse).

    La nuit 22h-7h + air excellent + PM2.5 < 10 → sleep (silence).

    '
  trigger:
  - platform: state
    entity_id: sensor.core_300s_qualite_de_l_air
  - platform: numeric_state
    entity_id: sensor.core_300s_pm2_5
    above: 15
  - platform: numeric_state
    entity_id: sensor.core_300s_pm2_5
    below: 10
  - platform: time
    at: '22:00:00'
  - platform: time
    at: 07:00:00
  - platform: state
    entity_id: fan.core_300s
    attribute: preset_mode
  action:
  - variables:
      pm25: '{{ states(''sensor.core_300s_pm2_5'') | float(0) }}'
      qa: '{{ states(''sensor.core_300s_qualite_de_l_air'') }}'
      now_h: '{{ now().hour }}'
      is_night: '{{ now().hour >= 22 or now().hour < 7 }}'
      current_preset: '{{ state_attr(''fan.core_300s'',''preset_mode'') }}'
      target: '{% if pm25 > 15 or qa not in [''excellent'',''good''] %}auto {% elif is_night and pm25 < 10 and qa == ''excellent'' %}sleep {% else %}auto{% endif %}'
  - condition: template
    value_template: '{{ target | trim != current_preset and is_state(''fan.core_300s'',''on'') }}'
  - action: fan.set_preset_mode
    target:
      entity_id: fan.core_300s
    data:
      preset_mode: '{{ target | trim }}'
  mode: single
- id: notif_sonnette_interphone
  alias: Notif - Sonnette interphone (vibration détectée)
  description: Détecte vibration sur le capteur Tuya collé au combiné Farfisa → notif iPhones
  trigger:
  - platform: state
    entity_id: binary_sensor.vibration_interphone
    to: 'on'
  action:
  - action: notify.iphones
    data:
      title: 🔔 Quelqu'un sonne
      message: Quelqu'un sonne à la porte d'entrée.
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  - delay:
      seconds: 30
  mode: single
- id: notif_four_pret
  alias: Notif - Four à température (iPhones présents)
  description: Notifie les iPhones des personnes à la maison quand le four atteint sa température cible Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
  trigger:
  - platform: template
    value_template: '{% set t = states(''sensor.four_temperature'') | float(0) %} {% set sp = states(''sensor.four_set_point'') | float(0) %} {{ sp > 30 and t >= sp }}'
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: state
    entity_id: sensor.four_machine_state
    state:
    - running
    - operating
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  - condition: template
    value_template: '{{ trigger.platform == ''time'' or trigger.from_state.state not in [''unavailable'', ''unknown'', ''none''] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  action:
  - variables:
      sp_text: '{{ states(''sensor.four_set_point'') | int(0) }}'
      msg: 🔥 Four prêt à {{ sp_text }}°C, tu peux enfourner !
  - choose:
    - conditions:
      - condition: state
        entity_id: person.kevin_allioli
        state: home
      - condition: state
        entity_id: person.loutre
        state: home
      sequence:
      - action: notify.iphones
        data:
          title: 🍳 Four prêt
          message: '{{ msg }}'
          data:
            push:
              sound: default
              interruption-level: time-sensitive
    - conditions:
      - condition: state
        entity_id: person.kevin_allioli
        state: home
      sequence:
      - action: notify.mobile_app_iphone_17_pro
        data:
          title: 🍳 Four prêt
          message: '{{ msg }}'
          data:
            push:
              sound: default
              interruption-level: time-sensitive
    - conditions:
      - condition: state
        entity_id: person.loutre
        state: home
      sequence:
      - action: notify.mobile_app_iphone
        data:
          title: 🍳 Four prêt
          message: '{{ msg }}'
          data:
            push:
              sound: default
              interruption-level: time-sensitive
  - delay:
      minutes: 15
  mode: single
- id: notif_four_securite_absence
  alias: 🚨 Sécurité - Four en marche pendant absence
  description: Alerte critique si le four tourne alors que les 2 personnes sont absentes
  trigger:
  - platform: state
    entity_id:
    - person.kevin_allioli
    - person.loutre
    to: not_home
    for:
      minutes: 5
  - platform: state
    entity_id: sensor.four_machine_state
    to: running
  - platform: state
    entity_id: sensor.four_machine_state
    to: operating
  condition:
  - condition: state
    entity_id: person.kevin_allioli
    state: not_home
  - condition: state
    entity_id: person.loutre
    state: not_home
  - condition: state
    entity_id: sensor.four_machine_state
    state:
    - running
    - operating
  action:
  - action: notify.iphones
    data:
      title: '🚨 SÉCURITÉ : Four en marche, personne à la maison'
      message: Four à {{ states("sensor.four_temperature") }}°C (cible {{ states("sensor.four_set_point") }}°C). Personne à la maison — vérifie ou arrête à distance.
      data:
        push:
          sound: default
          interruption-level: critical
        actions:
        - action: FOUR_STOP
          title: 🛑 Arrêter le four
        - action: FOUR_DISMISS
          title: Ignorer
  mode: single
- id: action_four_stop_distance
  alias: Action - Arrêter four (depuis notif sécurité)
  trigger:
  - platform: event
    event_type: mobile_app_notification_action
    event_data:
      action: FOUR_STOP
  action:
  - action: button.press
    target:
      entity_id: button.four_stop
  - action: notify.iphones
    data:
      message: 🛑 Four arrêté à distance.
  mode: single
- id: notif_porte_entree_oubli
  alias: Notif - Porte d'entrée ouverte > 5 min (oubli ?)
  description: Alerte si la porte d'entrée reste ouverte plus de 5 min en présence (oubli probable)
  trigger:
  - platform: state
    entity_id: binary_sensor.entree_porte_ouverture
    to: 'on'
    for:
      minutes: 5
  condition:
  - condition: or
    conditions:
    - condition: state
      entity_id: person.kevin_allioli
      state: home
    - condition: state
      entity_id: person.loutre
      state: home
  action:
  - action: notify.iphones
    data:
      title: 🚪 Porte d'entrée ouverte
      message: La porte d'entrée est ouverte depuis 5 min — oubli ?
      data:
        push:
          sound: default
          interruption-level: time-sensitive
  mode: single
- id: claude_brief_soir_signal
  alias: Claude - brief soir Signal (Sharmaison)
  description: Brief du soir exhaustif, ton loutre, envoye sur le groupe Signal Sharmaison
  trigger:
  - platform: time
    at: '22:00:00'
  action:
  - action: calendar.get_events
    target:
      entity_id: calendar.famille
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 23:59:59'') }}'
    response_variable: ev_famille
  - action: calendar.get_events
    target:
      entity_id: calendar.personnel
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 23:59:59'') }}'
    response_variable: ev_personnel
  - action: calendar.get_events
    target:
      entity_id: calendar.travail
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 23:59:59'') }}'
    response_variable: ev_travail
  - action: calendar.get_events
    target:
      entity_id: calendar.gros_champi
    data:
      start_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ (now() + timedelta(days=1)).strftime(''%Y-%m-%d 23:59:59'') }}'
    response_variable: ev_champi
  - action: calendar.get_events
    target:
      entity_id: calendar.famille
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    response_variable: ev_famille_today
  - action: calendar.get_events
    target:
      entity_id: calendar.personnel
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    response_variable: ev_personnel_today
  - action: calendar.get_events
    target:
      entity_id: calendar.travail
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    response_variable: ev_travail_today
  - action: calendar.get_events
    target:
      entity_id: calendar.gros_champi
    data:
      start_date_time: '{{ now().strftime(''%Y-%m-%d 00:00:00'') }}'
      end_date_time: '{{ now().strftime(''%Y-%m-%d %H:%M:%S'') }}'
    response_variable: ev_champi_today
  - action: conversation.process
    data:
      agent_id: conversation.claude_brief
      text: "Tu es l'assistant maison de Kevin et Loutre. Tu rediges le BRIEF DU SOIR, envoye sur Signal\n(format long). Le but n'est PAS de decrire l'etat de la maison a 22h00, mais de raconter ce qui\ns'est PASSE pendant la journee : qui a fait quoi, quels appareils ont tourne, qui est sorti et\nquand, quels evenements ont eu lieu, quel a ete le rythme de la journee. Tu narres au passe ce\nqui s'est deroule, puis tu donnes un coup d'oeil rapide a la nuit qui commence. Ton \"a la loutre\"\nfacon cyberloutre.fr : chaleureux, complice, un brin espiegle, anti-corporate, jamais marketing.\nTutoie le foyer.\n\nREGLES ABSOLUES (elles priment sur tout le reste) :\n1. INTERDICTION TOTALE d'halluciner ou d'inventer. Tu n'utilises QUE les donnees du SNAPSHOT\n   ci-dessous. Tu ne mentionnes JAMAIS un appareil, une piece, un volet, une porte, un\n   evenement, une meteo ou un etat qui n'y figure pas. Tu ne deduis rien, tu ne supposes rien :\n   dans le doute, tu n'en parles pas. Chaque affirmation doit etre directement appuyee par une\n   donnee du snapshot.\n2. Respecte EXACTEMENT l'etat de chaque appareil, sans jamais les confondre (le lave-vaisselle,\n   le lave-linge et le seche-linge sont trois machines distinctes).\n2bis. METEO : pour parler de PLUIE, utilise UNIQUEMENT le champ 'pluie aujourdhui' (vraie mesure pluvio). weather.forecast_maison est une PREVISION, JAMAIS un fait. Si pluie aujourdhui = 0 mm, NE DIS JAMAIS qu'il a plu. 2ter. IMPRIMANTE 3D : si 'Imprimante 3D Prusa' = 'inactive', ne la mentionne PAS dans le brief. Ne dis JAMAIS qu'elle 'a fini' sans preuve d'impression terminee aujourd'hui.\n2quater. ANOMALIES : pour lampes oubliees / fenetres ouvertes > 4h / batteries faibles, utilise UNIQUEMENT le champ 'Anomalies actionnables' du SNAPSHOT. Si dit 'aucune', NE LE MENTIONNE PAS dans le brief (= rien d'anormal). Sinon, signale les listes nommees dans la section *Vigilance*. 2septies. MAINTENANCE NOMINEE : pour la section maintenance, tu dois TOUJOURS nommer explicitement les tâches en attente du champ 'Maintenance' du snapshot, AVEC leur ancienneté. Les taches marquees ÇA TRAÎNE (3-6 jours) doivent etre signalees avec un ton un peu pressant. Les taches marquees ÇA URGE BORDEL (>= 7 jours) doivent etre signalees en TOUT PREMIER avec un ton clairement insistant, sans etre alarmiste. Si 'Maintenance: tout est en ordre' → mentionne juste 'rien à signaler côté maintenance'. JAMAIS de formulation 'X actions' sans détailler quoi. 2novies. PRESENCE TEMPORELLE : tu n'affirmes JAMAIS qu'une personne a ete a la maison 'toute la journee' ou 'au chaud avec toi'. Le snapshot ne donne que l'etat MAINTENANT + l'heure du dernier changement. Si Kevin est 'home depuis 19h00', il etait DEHORS avant (probablement au travail). Formule du type 'Kevin vient de rentrer' ou 'Kevin est rentre vers 19h, profite de la soiree avec toi maintenant'. JAMAIS de fausse generalisation sur la journee complete. 2octies. VOLETS : utilise UNIQUEMENT le champ 'Volets_synthese'. Ne JAMAIS énumérer les 4 volets individuellement. Si 'tous ouverts (normal en journee)' → ne MENTIONNE PAS les volets du tout dans le brief (= info inutile). Si volets mixtes ou tous fermés → mentionne en une phrase courte ('les volets sont déjà fermés', 'X/4 volets ouverts'). 2quinquies. ANTI-ENUMERATION : tu n'écris JAMAIS de liste pièce par pièce avec leurs chiffres (ex: 'chambre 21C humidité 50% CO2 600ppm'). Pour la section *Le confort des pièces*, utilise EXCLUSIVEMENT le champ 'Confort_synthese' du snapshot. Si tout est OK → une seule phrase de synthèse. Si anomalies → mentionne nominativement UNIQUEMENT les pièces problématiques avec le geste recommandé. Style narratif uniquement, jamais de format 'pièce: chiffres'.\n2sexies. NOMS HUMAINS UNIQUEMENT : tu n'écris JAMAIS d'identifiant technique. Interdits : entity_id (ex: sensor.X, binary_sensor.X, light.X), références à des marques/modèles (Aqara, FP300, Hue, MK4S, S8 Pro, Ledvance...), noms construits avec underscores ou suffixes numériques (_2, _3). Utilise UNIQUEMENT des formulations humaines fluides : 'le détecteur d'''entrée', 'le radiateur du salon', 'l'''imprimante 3D', 'l'''aspirateur robot', 'la chambre Raphaël', 'la lampe du couloir'. Si tu ne sais pas comment nommer quelque chose proprement, n'''en parle PAS du tout. 3. Francais naturel et idiomatique uniquement. AUCUN anglicisme, AUCUN mot invente ni neologisme\n   (ne fabrique jamais un adjectif ou un surnom), AUCUNE tournure qui sonne traduite. L'espieglerie\n   passe par le ton et le regard sur la journee, jamais par des mots forces. Ouvre simplement par\n   \"\U0001F9A6 *Bonsoir*\" sans surnom ajoute pour Kevin et Loutre.\n4. Si une donnee est indisponible (unknown / unavailable / none), tu l'ignores, tu ne l'affiches\n   jamais telle quelle.\n\nMise en forme Signal \"styled\" : *texte* = gras (titres de section), _texte_ = italique leger.\nUne ligne vide entre les sections. Pas de markdown #, pas de tableaux, pas de listes a puces.\nQuelques emojis ponctuels (pas a chaque ligne). Longueur : exhaustif mais digeste (1500-2500 caracteres).\n\nStructure (n'aborde une section que si tu as des donnees pour elle, et tu RACONTES au passe) :\n- Ouverture \"\U0001F9A6 *Bonsoir*\" puis une phrase qui resume le caractere de la journee.\n- *La journee* : RECAP CHRONOLOGIQUE de ce qui s'est passe. Croise les agregats 'Presence' et 'Appareils' (qui sont des compteurs du JOUR fiables) avec les evenements calendrier d'aujourd'hui (champ 'Evenements aujourd hui'). Exemple de narration : 'Loutre tu as commence la journee tot avec X, vous etes rentres ensemble en debut d'apres-midi pour Y, le lave-vaisselle a tourne dans la matinee, le robot a fait son passage tot...'. Si une donnee chronologique manque (ex: heure precise du cycle LV), tu restes vague ('le lave-vaisselle a tourne dans la journee') sans l'inventer.\n- *Le confort des pieces* : un point sur le confort actuel, anomalies seulement.\n- *Energie* : conso du jour, cout, couleur Tempo de demain, ce que le solaire Beem a rapporte aujourd'hui (production en Wh + economies en euros), et un conseil concret pour DEMAIN.\n- *Vigilance* : fenetres, serrure, Tesla, maintenance, anomalies. Ton observationnel, pas alarmiste.\n- *Demain* : prochain evenement du calendrier + meteo au lever, termine par une question actionnable UNIQUEMENT si une action concrète mérite vraiment d'être posée. Sinon, conclus par une touche chaleureuse en une phrase, sans forcer de question.\n\nSNAPSHOT 24h:\nPresence (agregats du JOUR — fiables, ne PAS extrapoler au-dela): Kevin etat MAINTENANT={{ states('person.kevin_allioli') }}, a passe {{ states('sensor.kevin_home_today') | float(0) | round(1) }}h a la maison aujourd hui sur {{ ((as_timestamp(now()) - as_timestamp(today_at('00:00'))) / 3600) | round(1) }}h ecoulees ({{ states('sensor.kevin_home_arrivals_today') }} retours), donc {% set kr = states('sensor.kevin_home_today') | float(0) / (((as_timestamp(now()) - as_timestamp(today_at('00:00'))) / 3600) | float(0.01)) * 100 %}{% if kr > 80 %}a passe l essentiel de la journee A LA MAISON, sorti(es) brievement{% elif kr > 40 %}a alterne presence et sorties dans la journee{% else %}etait absent une bonne partie de la journee{% endif %}. Loutre etat MAINTENANT={{ states('person.loutre') }}, a passe {{ states('sensor.loutre_home_today') | float(0) | round(1) }}h a la maison aujourd hui sur {{ ((as_timestamp(now()) - as_timestamp(today_at('00:00'))) / 3600) | round(1) }}h ecoulees ({{ states('sensor.loutre_home_arrivals_today') }} retours), donc {% set lr = states('sensor.loutre_home_today') | float(0) / (((as_timestamp(now()) - as_timestamp(today_at('00:00'))) / 3600) | float(0.01)) * 100 %}{% if lr > 80 %}a passe l essentiel de la journee A LA MAISON, sortie(s) brieve(s){% elif lr > 40 %}a alterne presence et sorties dans la journee{% else %}etait absente une bonne partie de la journee{% endif %}\nConso jour: {{ states('sensor.energy_daily_cost') | float(0) | round(2) }} EUR\nTarif: {{ state_attr('sensor.current_tariff_price','period') }} {{ state_attr('sensor.current_tariff_price','color') }}\nTempo aujourdhui: {{ states('sensor.rte_tempo_couleur_actuelle') }} {{ states('sensor.rte_tempo_couleur_actuelle_visuel') }}\nTempo demain: {{ states('sensor.rte_tempo_prochaine_couleur') }} {{ states('sensor.rte_tempo_prochaine_couleur_visuel') }}\nConso live: {{ (states('sensor.power_net') | float(0) / 1000) | round(2) }} kW{% set p = states('sensor.power_net') | float(0) %}{% if p > 5000 %} — CONSO ANORMALE: quelque chose tourne fort, vérifie{% endif %}\nSolaire Beem aujourd'hui: production {{ states('sensor.beembox_18562_production_du_jour') }} Wh, economies du jour {{ states('sensor.solar_daily_savings') | float(0) | round(2) }} EUR, autoconsommation {{ states('sensor.solar_self_consumption_rate') }}%, economies cumulees {{ states('sensor.solar_savings_running_total') | float(0) | round(2) }} EUR\nT salon: {{ states('sensor.weather_station_temperature') }}C, dehors {{ states('sensor.weather_station_outdoor_module_temperature') }}C, ciel {{ states('weather.forecast_maison') }} (prévision), pluie aujourdhui: {{ states('sensor.weather_station_pluviometre_precipitation_aujourd_hui') }} mm (vraie mesure)\nConfort_synthese: {% set rooms_T = {'Chambre Raphaël': states('sensor.weather_station_chambre_de_raphael_temperature')|float(20),'Chambre parentale': states('sensor.weather_station_chambre_temperature')|float(20),'Bureau': states('sensor.weather_station_bureau_temperature')|float(20),'Salle de bain': states('sensor.temperature_humidity_bathroom_temperature')|float(20),'Salon': states('sensor.weather_station_temperature')|float(20)} %}{% set t_anom = [] %}{% for k, v in rooms_T.items() %}{% if v < 18 %}{% set t_anom = t_anom + [k ~ ' froid (' ~ v|round(1) ~ 'C)'] %}{% elif v > 26 %}{% set t_anom = t_anom + [k ~ ' chaud (' ~ v|round(1) ~ 'C)'] %}{% endif %}{% endfor %}Temp: {% if t_anom %}{{ t_anom | join(', ') }}{% else %}confort OK partout ({{ (rooms_T.values()|list|sum\
        \ / rooms_T|count)|round(1) }}C moy){% endif %}. {% set rooms_H = {'Chambre Raphaël': states('sensor.weather_station_chambre_de_raphael_humidite')|float(50),'Chambre parentale': states('sensor.weather_station_chambre_humidite')|float(50),'Salle de bain': states('sensor.temperature_humidity_bathroom_humidity')|float(50),'Bureau': states('sensor.weather_station_bureau_humidite')|float(50)} %}{% set h_anom = [] %}{% for k, v in rooms_H.items() %}{% if v < 35 %}{% set h_anom = h_anom + [k ~ ' sec (' ~ v|round(0) ~ '%)'] %}{% elif v > 65 %}{% set h_anom = h_anom + [k ~ ' humide (' ~ v|round(0) ~ '%)'] %}{% endif %}{% endfor %}Humid: {% if h_anom %}{{ h_anom | join(', ') }}{% else %}OK{% endif %}. {% set rooms_C = {'Chambre Raphaël': states('sensor.weather_station_chambre_de_raphael_dioxyde_de_carbone')|int(0),'Chambre parentale': states('sensor.weather_station_chambre_dioxyde_de_carbone')|int(0),'Bureau': states('sensor.weather_station_bureau_dioxyde_de_carbone')|int(0)} %}{% set c_anom = [] %}{% for k, v in rooms_C.items() %}{% if v > 1500 %}{% set c_anom = c_anom + [k ~ ' AERATION URGENTE (' ~ v ~ 'ppm)'] %}{% elif v > 1000 %}{% set c_anom = c_anom + [k ~ ' à aérer (' ~ v ~ 'ppm)'] %}{% endif %}{% endfor %}CO2: {% if c_anom %}{{ c_anom | join(', ') }}{% else %}OK partout{% endif %}.\nChambre Raphael: {{ states('sensor.weather_station_chambre_de_raphael_temperature') }}C, Humidite {{ states('sensor.weather_station_chambre_de_raphael_humidite') }}%, CO2 {{ states('sensor.weather_station_chambre_de_raphael_dioxyde_de_carbone') }}ppm ({% set c = states('sensor.weather_station_chambre_de_raphael_dioxyde_de_carbone')|int(0) %}{% if c < 1000 %}qualite bonne{% elif c < 1500 %}aeration a faire dans la journee{% else %}AERATION RECOMMANDEE AVANT COUCHER{% endif %})\nChambre parentale: {{ states('sensor.weather_station_chambre_temperature') }}C, Humidite {{ states('sensor.weather_station_chambre_humidite') }}%, CO2 {{ states('sensor.weather_station_chambre_dioxyde_de_carbone') }}ppm\nBureau: {{ states('sensor.weather_station_bureau_temperature') }}C, CO2 {{ states('sensor.weather_station_bureau_dioxyde_de_carbone') }}ppm\nSDB: {{ states('sensor.temperature_humidity_bathroom_temperature') }}C, Humidite {{ states('sensor.temperature_humidity_bathroom_humidity') }}%\nShiva: derniere sortie il y a {% set h_shiva = ((as_timestamp(now()) - as_timestamp(states('input_datetime.last_shiva_walk'))) / 3600) | float(0) %}{{ h_shiva | round(1) }}h{% if h_shiva > 5 %} — A SORTIR (>{{ 5 }}h){% endif %}\nLumieres ON: {{ states.light | selectattr('state','eq','on') | rejectattr('attributes.entity_id','defined') | rejectattr('entity_id','match','.*_dnd$') | list | count }}\nFenetres ouvertes: {% set ouvertes = states.binary_sensor | selectattr('attributes.device_class','in',['window','door','opening']) | reject('match', '.*(lave_vaisselle|lave_linge|seche_linge|refrigerateur|frigo|congelateur|four_door|machine_a_cafe|imprimante|josette|aqara_door_and_window_sensor).*') | selectattr('state','eq','on') | list %}{{ ouvertes | count }}{% if ouvertes %} ({% for o in ouvertes %}{{ o.attributes.friendly_name }}{{ ', ' if not loop.last }}{% endfor %}){% endif %}\nVolets_synthese: {% set vs = ['cover.raphael_volet_shutter','cover.cuisine_volet_shutter','cover.salon_baie_vitree_shutter','cover.salon_fenetre_volet_shutter'] %}{% set ouverts = vs | select('is_state','open') | list %}{% set fermes = vs | select('is_state','closed') | list %}{% if ouverts | count == vs | count %}tous ouverts (normal en journee){% elif fermes | count == vs | count %}tous fermes{% else %}{{ ouverts | count }}/{{ vs | count }} ouverts{% endif %}\nSerrure: {{ states('lock.smart_lock_pro') }}{% set lock_off = not is_state('lock.smart_lock_pro','locked') %}{% set absents = is_state('person.kevin_allioli','not_home') and is_state('person.loutre','not_home') %}{% if lock_off and absents %} — URGENCE: PORTE NON VERROUILLEE ET PERSONNE A LA MAISON{% endif %}\nModes maison: Vacances={{ states('input_boolean.mode_vacances') }}, Nounou={{ states('input_boolean.mode_nounou') }} (Nounou=on explique volets ouverts/fenetres laissees)\nMaintenance: {% set items = state_attr('sensor.maintenance_actions','items') or [] %}{% if items|count == 0 %}tout est en ordre{% else %}{% set ns = namespace(out=[]) %}{% for it in items %}{% set st = states[it.entity] %}{% if st and st.last_changed %}{% set days = ((as_timestamp(now()) - as_timestamp(st.last_changed)) / 86400) | int %}{% set tag = (' [JOUR-MEME]' if days == 0 else ' [' ~ days ~ 'j]' if days < 3 else ' [' ~ days ~ 'j — ÇA TRAÎNE]' if days < 7 else ' [' ~ days ~ 'j — ÇA URGE BORDEL]') %}{% set ns.out = ns.out + [{'name': it.name, 'days': days, 'tag': tag}] %}{% else %}{% set ns.out = ns.out + [{'name': it.name, 'days': -1, 'tag': ''}] %}{% endif %}{% endfor %}{% set sorted_out = ns.out | sort(attribute='days', reverse=true) %}{% for x in sorted_out %}{{ x.name }}{{ x.tag }}{{ '. ' if not loop.last else '' }}{% endfor %}{% endif %}. Batteries faibles (<20%): {%- set out = namespace(l=[]) -%}{%- for x in states.sensor -%}{%- if x.attributes.device_class == 'battery' and 'tension' not in x.entity_id and 'iphone' not in x.entity_id and 'watch' not in x.entity_id and x.state|float(-1) >= 0 and x.state|float(-1) < 20 -%}{%- set out.l = out.l + [(x.attributes.friendly_name | replace(' Batterie','') | replace(' Battery','') | trim) ~ ' (' ~ x.state ~ '%)'] -%}{%- endif -%}{%- endfor -%}{{ out.l | join(', ') if out.l else 'aucune' }}\nAnomalies actionnables: Lampes ON > 4h: {%- set la = namespace(l=[]) -%}{%- for L in states.light | selectattr('state','eq','on') | rejectattr('attributes.entity_id','defined') | rejectattr('entity_id','match','.*_dnd$') -%}{%- set h = ((as_timestamp(now()) - as_timestamp(L.last_changed)) / 3600) | float(0) -%}{%- if h > 4 -%}{%- set la.l = la.l + [L.attributes.friendly_name ~ ' (' ~ (h | round(1)) ~ 'h)'] -%}{%- endif -%}{%- endfor -%}{{ la.l | join(', ') if la.l else 'aucune' }}. Fenetres ouvertes > 4h: {%- set fa = namespace(l=[]) -%}{%- for F in states.binary_sensor | selectattr('attributes.device_class','in',['window','door','opening']) | selectattr('state','eq','on') -%}{%- set h = ((as_timestamp(now()) - as_timestamp(F.last_changed)) / 3600) | float(0) -%}{%- if h > 4 -%}{%- set fa.l = fa.l + [F.attributes.friendly_name ~ ' (' ~ (h | round(1)) ~ 'h)'] -%}{%- endif -%}{%- endfor -%}{{ fa.l | join(', ') if fa.l else 'aucune' }}. Devices indisponibles: {{ states | selectattr('state','in',['unavailable','unknown']) | rejectattr('entity_id','match','.*_dnd$') | rejectattr('entity_id','match','^scene\\.') | list | count }}\nTesla: {{ states('sensor.josette_niveau_de_batterie') }}% ({{ states('sensor.josette_charging') }})\nEvenements aujourd hui DEJA PASSES (TOUS les events des 4 calendriers): {%- set nt = namespace(events=[]) -%}{%- for src in [ev_famille_today, ev_personnel_today, ev_travail_today, ev_champi_today] -%}{%- for cal_data in (src.values() if src is mapping else []) -%}{%- for e in (cal_data.events if cal_data is mapping and cal_data.events is defined else []) -%}{%- set hm = (e.start | default('00:00:00'))[11:16] if (e.start | default('')) and ':' in (e.start | default('')) else '00:00' -%}{%- set entry = hm ~ '  ·  ' ~ (e.summary | default('sans titre')) -%}{%- if (e.location | default('')) -%}{%- set entry = entry ~ '  ·  \U0001F4CD ' ~ (e.location | default('')) -%}{%- endif -%}{%- set nt.events = nt.events + [entry] -%}{%- endfor -%}{%- endfor -%}{%- endfor -%}{%- if nt.events -%} | {{ nt.events | sort | join(' | ') }}{%- else -%} (aucun){%- endif -%}\nEvenements demain (TOUS les events des 4 calendriers): {%- set ns = namespace(events=[]) -%}{%- for src in [ev_famille, ev_personnel, ev_travail, ev_champi] -%}{%- for cal_data in (src.values() if src is mapping else []) -%}{%- for e in (cal_data.events if cal_data is mapping and cal_data.events is defined else []) -%}{%- set hm = (e.start | default('00:00:00'))[11:16] if (e.start | default('')) and ':' in (e.start | default('')) else '00:00' -%}{%- set entry = hm ~ '  ·  ' ~ (e.summary | default('sans titre')) -%}{%- if (e.location | default('')) -%}{%- set entry = entry ~ '  ·  \U0001F4CD ' ~ (e.location | default('')) -%}{%- endif -%}{%- set ns.events = ns.events + [entry] -%}{%- endfor -%}{%- endfor -%}{%- endfor -%}{%- if ns.events -%} | {{ ns.events | sort | join(' | ') }}{%- else -%} (rien de prevu){%- endif -%}\nAppareils (compteurs du JOUR — agreges via history_stats, fiables): Lave-vaisselle {{ states('sensor.cuisine_lave_vaisselle_cycles_today') }} cycle(s) termine(s) aujourd hui (statut a l instant: {{ states('sensor.lave_vaisselle_current_status') }}), Lave-linge {{ states('sensor.salle_de_bains_machine_a_laver_lave_linge_hublot_cycles_today') }} cycle(s) termine(s) aujourd hui (statut: {{ states('sensor.lave_linge_hublot_current_status') }}), Seche-linge {{ states('sensor.toilettes_seche_linge_seche_linge_cycles_today') }} cycle(s) termine(s) aujourd hui (statut: {{ states('sensor.seche_linge_current_status') }}), Aspirateur robot {{ states('sensor.salon_s8_pro_ultra_sessions_today') }} session(s) aujourd hui pour {{ states('sensor.salon_s8_pro_ultra_time_today') | float(0) | round(1) }}h cumulees{% if states('vacuum.s8_pro_ultra') in ['cleaning','returning'] %} — EN COURS MAINTENANT{% endif %}, eau propre={% if is_state('binary_sensor.s8_pro_ultra_dock_clean_water_box','on') %}A REMPLIR{% else %}OK{% endif %}, eau sale={% if is_state('binary_sensor.s8_pro_ultra_dock_dirty_water_box','on') %}A VIDER{% else %}OK{% endif %}, Imprimante 3D Prusa {% if states('sensor.prusa_mk4s') in ['printing','paused','error','attention'] %}{{ states('sensor.prusa_mk4s') }} (avancement {{ states('sensor.prusa_mk4s_avancement') }}%, fin estimée {{ states('sensor.prusa_mk4s_fin_de_l_impression') }}){% else %}inactive (PAS d impression en cours){% endif %}\n"
    response_variable: ai
  - action: shell_command.signal_sharmaison
    data:
      message: '{{ (ai.response.speech.plain.speech if ai is defined and ai.response is defined else "DEBUG: ai vide ou response manquante. ai=" ~ (ai | string)[:300]) }}'
  mode: single
- id: lg_appliance_alerts_relay
  alias: Notif - Alertes electromenager LG
  description: Relaie les alertes LG non couvertes par les blueprints (sel, fuite, erreurs, echecs, filtre air frigo) vers les iPhones, et capture le besoin de sel pour la maintenance. Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
  trigger:
  - platform: state
    entity_id:
    - event.lave_vaisselle_notification
    - event.lave_vaisselle_error
    - event.lave_linge_hublot_notification
    - event.lave_linge_hublot_error
    - event.seche_linge_notification
    - event.seche_linge_error
    - event.refrigerateur_notification
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: template
    value_template: '{{ trigger.from_state.state not in ["unavailable","unknown","none",""] and trigger.to_state.state not in ["unavailable","unknown","none",""] }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  action:
  - variables:
      eid: '{{ trigger.entity_id }}'
      et: '{{ trigger.to_state.attributes.event_type }}'
      appl: '{% if "lave_vaisselle" in eid %}Lave-vaisselle{% elif "lave_linge" in eid %}Lave-linge{% elif "seche_linge" in eid %}Sèche-linge{% elif "refrigerateur" in eid %}Frigo{% else %}Électroménager{% endif %}'
      base: '{% if eid.endswith("_error") %}Erreur technique ({{ et }}){% else %}{{ {"salt_refill_is_needed":"Ajouter du sel régénérant","water_leak_has_occurred":"Fuite d''eau détectée","error_during_cleaning":"Erreur pendant le cycle","drying_failed":"Échec du séchage","error_during_washing":"Erreur pendant le lavage","time_to_change_filter":"Filtre à changer"}.get(et, "") }}{% endif %}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ base | trim != "" }}'
      sequence:
      - action: notify.iphones
        data:
          title: 🔧 {{ appl }}
          message: '{{ base }}'
  - if:
    - condition: template
      value_template: '{{ et == "salt_refill_is_needed" }}'
    then:
    - action: input_boolean.turn_on
      target:
        entity_id: input_boolean.lave_vaisselle_sel
  mode: queued
  max: 10
- id: lametric_visiteur
  alias: LaMetric - Visiteur interphone
  trigger:
  - platform: state
    entity_id: binary_sensor.vibration_interphone
    to: 'on'
  action:
  - action: script.lametric_notify
    data:
      message: Visiteur a la porte
      sound: knock-knock
      priority: critical
      cycles: 3
