  description: Notif quand le timestamp fin_du_dernier_nettoyage change (= cycle complet terminé). Plus fiable que docked (qui se produit aussi sur retour recharge mi-cycle). Fenêtre 7h-23h ; rattrapage à 7h si état toujours actif.
  trigger:
  - platform: state
    entity_id: sensor.s8_pro_ultra_fin_du_dernier_nettoyage
  - platform: time
    at: 07:00:00
    id: matin
  condition:
  - condition: template
    value_template: '{{ trigger.from_state.state not in [''unknown'',''unavailable'',] and trigger.to_state.state not in [''unknown'',''unavailable'',] and states(''sensor.s8_pro_ultra_surface_de_nettoyage'')|float(0) > 1 }}'
  - condition: time
    after: 07:00:00
    before: '23:00:00'
  action:
  - action: notify.iphones
    data:
