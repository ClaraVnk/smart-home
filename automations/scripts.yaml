lametric_notify:
  alias: LaMetric - notifier
  icon: mdi:clock-digital
  mode: queued
  max: 10
  fields:
    message:
      description: Texte a afficher
      required: true
    icon:
      description: ID icone LaMetric
      default: '2867'
    sound:
      description: Son
      default: notification
    priority:
      description: info / warning / critical
      default: info
    cycles:
      description: Repetitions
      default: 2
  sequence:
  - action: lametric.message
    continue_on_error: true
    data:
      device_id: 9522b171c66e32422ee4a83a6f8d2b69
      message: '{{ message }}'
      icon: '{{ icon | default(''2867'') }}'
      sound: '{{ sound | default(''notification'') }}'
      priority: '{{ priority | default(''info'') }}'
      cycles: '{{ cycles | default(2) | int }}'
radiateurs_tout_couper:
  alias: ❄️ Couper tous les radiateurs
  icon: mdi:radiator-off
  description: Passe les 6 radiateurs Atlantic en preset frost_guard (= 7°C hors gel). Évite l'erreur 403 Netatmo causée par climate.turn_off.
  sequence:
  - action: climate.set_preset_mode
    target:
      entity_id: &id001
      - climate.salon_2
      - climate.entree
      - climate.cuisine
      - climate.chambre
      - climate.bureau
      - climate.chambre_damis
    data:
      preset_mode: frost_guard
  mode: single
radiateurs_tout_auto:
  alias: 🔥 Radiateurs en mode programme
  icon: mdi:radiator
  description: Repasse les 6 radiateurs Atlantic en preset 'schedule' (= leur programme normal). Action inverse de 'tout couper'.
  sequence:
  - action: climate.set_preset_mode
    target:
      entity_id: *id001
    data:
      preset_mode: schedule
  mode: single
clim_bureau_mode_dry:
  alias: ❄️ Clim bureau — Mode déshumidification
  icon: mdi:water-percent
  description: Passe le clim du bureau en mode déshumidification (dry).
  sequence:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.clim_bureau
    data:
      hvac_mode: dry
  mode: single
clim_bureau_mode_fan_only:
  alias: 💨 Clim bureau — Mode ventilation
  icon: mdi:fan
  description: Passe le clim du bureau en mode ventilation seule (fan only).
  sequence:
  - action: climate.set_hvac_mode
    target:
      entity_id: climate.clim_bureau
    data:
      hvac_mode: fan_only
  mode: single
