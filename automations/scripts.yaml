ambiance_soir_silencieux:
  alias: 🌙 Soir silencieux (salon + entrée)
  description: Allume Hue Play, Lampe d'ambiance, Lampe glaçon (preset Nuit silencieuse) + plafonnier entrée
  icon: mdi:weather-night
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.hue_play_1
    data:
      brightness_pct: 65
      xy_color:
      - 0.5068
      - 0.3702
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_dambiance
    data:
      brightness_pct: 65
      xy_color:
      - 0.4777
      - 0.3856
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_glacon
    data:
      brightness_pct: 20
      color_temp_kelvin: 2702
      transition: 3
ambiance_cinema:
  alias: 🎬 Cinéma (lampes salon tamisées 30%)
  description: Tamise Hue Play, Lampe d'ambiance, Lampe glaçon à 30% chaud pour ambiance film
  icon: mdi:movie-roll
  sequence:
  - action: light.turn_on
    target:
      entity_id: light.hue_play_1
    data:
      brightness_pct: 30
      color_temp_kelvin: 2200
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_dambiance
    data:
      brightness_pct: 30
      color_temp_kelvin: 2200
      transition: 3
  - action: light.turn_on
    target:
      entity_id: light.lampe_glacon
    data:
      brightness_pct: 30
      color_temp_kelvin: 2200
      transition: 3
