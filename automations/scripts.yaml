speciale_nounou:
  alias: 🐈 Spéciale Nounou
  description: Volets en positions chat (baie 19%, cuisine 25%, salon fenêtre + Raphaël fermés)
  icon: mdi:cat
  sequence:
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.mode_nounou
  - action: cover.set_cover_position
    target:
      entity_id: cover.salon_baie_vitree_shutter
    data:
      position: 19
  - action: cover.set_cover_position
    target:
      entity_id: cover.cuisine_volet_shutter
    data:
      position: 25
  - action: cover.close_cover
    target:
      entity_id:
      - cover.salon_fenetre_volet_shutter
      - cover.raphael_volet_shutter
veilleuse_raphael:
  alias: 🌙 Veilleuse Raphaël
  description: Allume guirlande + Hue Go + lampe nuage en mode veilleuse
  icon: mdi:weather-night
  sequence:
  - action: light.turn_on
    target:
      entity_id:
      - light.guirlande
      - light.hue_go_1
      - light.hue_ambiance_candle_1
    data:
      brightness_pct: 20
      color_temp_kelvin: 2200
a_la_sieste:
  alias: 😴 À la sieste (Raphaël)
  description: Ambiance sieste — volet fermé, luminaire et accessoires off, lampe nuage 15%, HomePod en pause
  icon: mdi:sleep
  sequence:
  - action: cover.close_cover
    target:
      entity_id: cover.raphael_volet_shutter
  - action: light.turn_off
    target:
      entity_id:
      - light.luminaire_chambre_bebe
      - light.guirlande
      - light.hue_go_1
  - action: light.turn_on
    target:
      entity_id: light.hue_ambiance_candle_1
    data:
      brightness_pct: 15
      color_temp_kelvin: 2200
  - action: media_player.media_pause
    target:
      entity_id: media_player.chambre
au_dodo:
  alias: 😴 Au dodo
  description: Coucher parental — luminaire chambre off, HomePod pause, bibliothèque 35%, lit 20%
  icon: mdi:bed
  sequence:
  - action: light.turn_off
    target:
      entity_id: light.chambre
  - action: light.turn_on
    target:
      entity_id: light.hue_go_1_2
    data:
      brightness_pct: 35
  - action: light.turn_on
    target:
      entity_id: light.lit
    data:
      brightness_pct: 20
  - action: media_player.media_pause
    target:
      entity_id: media_player.chambre
ouvre_tous_volets:
  alias: 🪟 Ouvre tous les volets
  description: Ouvre salon (baie + fenêtre) + cuisine (préserve volet Raphaël)
  icon: mdi:window-shutter-open
  sequence:
  - action: cover.open_cover
    target:
      entity_id:
      - cover.salon_baie_vitree_shutter
      - cover.salon_fenetre_volet_shutter
      - cover.cuisine_volet_shutter
quitter_la_maison:
  alias: 🚪 Quitter la maison
  description: Mode goodbye manuel - tout off + lock + ferme volets
  icon: mdi:door-closed-lock
  sequence:
  - action: light.turn_off
    target:
      entity_id: all
  - action: lock.lock
    target:
      entity_id: lock.smart_lock_pro
  - action: cover.close_cover
    target:
      entity_id:
      - cover.salon_baie_vitree_shutter
      - cover.salon_fenetre_volet_shutter
      - cover.cuisine_volet_shutter
  - action: notify.iphones
    data:
      message: 🚪 Maison fermée - lumières off, porte verrouillée, volets fermés.
toggle_serrure_entree:
  alias: 🔒 Toggle serrure entrée
  icon: mdi:lock
  sequence:
  - choose:
    - conditions:
      - condition: state
        entity_id: lock.smart_lock_pro
        state: locked
      sequence:
      - action: lock.unlock
        target:
          entity_id: lock.smart_lock_pro
    - conditions:
      - condition: state
        entity_id: lock.smart_lock_pro
        state: unlocked
      sequence:
      - action: lock.lock
        target:
          entity_id: lock.smart_lock_pro
menage_passage_rapide_invites:
  alias: 🚀 Ménage - passage rapide invités (salon + cuisine)
  icon: mdi:run-fast
  sequence:
  - action: vacuum.set_fan_speed
    target:
      entity_id: vacuum.s8_pro_ultra
    data:
      fan_speed: max
  - action: select.select_option
    target:
      entity_id: select.s8_pro_ultra_intensite_de_frottement
    data:
      option: 'off'
  - action: vacuum.send_command
    target:
      entity_id: vacuum.s8_pro_ultra
    data:
      command: app_segment_clean
      params:
      - 22
      - 21
menage_complet:
  alias: 🧹 Ménage - nettoyage complet
