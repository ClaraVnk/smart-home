title: Showcase
views:
- title: Maison
  path: home
  icon: mdi:home-variant
  theme: home_glass_showcase
  background: 'radial-gradient(circle at 20% 20%, rgba(167, 139, 250, 0.30) 0%, transparent 50%),

    radial-gradient(circle at 80% 80%, rgba(96, 165, 250, 0.25) 0%, transparent 50%),

    linear-gradient(180deg, #0f172a 0%, #1e293b 60%, #0f172a 100%) fixed

    '
  type: sections
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Accueil
      heading_style: title
      icon: mdi:home-heart
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-person-card
        layout: horizontal
        entity: person.kevin_allioli
        primary_info: name
        secondary_info: state
        use_entity_picture: true
      - type: custom:mushroom-person-card
        layout: horizontal
        entity: person.loutre
        primary_info: name
        secondary_info: state
        use_entity_picture: true
    - type: custom:mushroom-chips-card
      alignment: center
      chips:
      - type: weather
        entity: weather.forecast_maison
        show_conditions: true
        show_temperature: true
      - type: template
        entity: sensor.weather_station_outdoor_module_temperature
        icon: mdi:thermometer
        content: '{{ states(entity) }}°C'
        icon_color: '{% set v = states(entity) | float(20) %} {% if v < 0 %}blue{% elif v < 10 %}light-blue{% elif v <= 25 %}green{% elif v <= 30 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: entity
        entity: sensor.maintenance_actions
        icon_color: '{% set urgent = is_state_attr(''sensor.maintenance_actions'', ''urgent'', true) %} {% set n = states(''sensor.maintenance_actions'') | int(0) %} {% if urgent %}red{% elif n > 0 %}orange{%
          else %}green{% endif %}'
        content_info: state
        tap_action:
          action: navigate
          navigation_path: /maintenance-yaml/todo
      - type: template
        entity: input_boolean.mode_vacances
        icon: mdi:beach
        content: '{{ ''Vacances ON'' if is_state(entity,''on'') else ''Vacances'' }}'
        icon_color: '{{ ''orange'' if is_state(entity,''on'') else ''grey'' }}'
        tap_action:
          action: toggle
      - type: template
        entity: sensor.josette_niveau_de_batterie
        icon: mdi:car-electric
        content: '{% set v = states(entity) %} {% if v in [''unknown'',''unavailable''] %}🌙{% else %}{{ v }}%{% endif %}'
        icon_color: '{% set s = states(entity) %} {% if s in [''unknown'',''unavailable''] %}grey {% else %}{% set v = s | int(0) %}{% if v < 20 %}red{% elif v < 40 %}orange{% else %}green{% endif %}{%
          endif %}'
        tap_action:
          action: navigate
          navigation_path: /josette-yaml/josette
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: horizontal-stack
      cards:
      - type: picture-entity
        entity: camera.g4_instant_high_resolution_channel
        show_state: false
        show_name: false
        camera_view: auto
        aspect_ratio: '16:9'
        card_mod:
          style: 'ha-card { max-height: 240px !important; overflow: hidden; }'
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        primary: Agenda du jour
        secondary: '{%- set today = now().date() -%}{%- set out = namespace(events=[]) -%}{%- for cal in [''calendar.famille'',''calendar.personnel'',''calendar.travail'',''calendar.gros_champi''] -%}{%-
          set start = state_attr(cal,''start_time'') -%}{%- set msg = state_attr(cal,''message'') -%}{%- set loc = state_attr(cal,''location'') -%}{%- if start and msg -%}{%- set sdate = strptime(start[:10],''%Y-%m-%d'').date()
          -%}{%- if sdate == today -%}{%- set entry = start[11:16] ~ ''  ·  '' ~ msg -%}{%- if loc -%}{%- set entry = entry ~ ''  ·  📍 '' ~ loc -%}{%- endif -%}{%- set out.events = out.events + [entry]
          -%}{%- endif -%}{%- endif -%}{%- endfor -%}{%- if out.events -%}{{ out.events | sort | join(''\n'') }}{%- else -%}Rien aujourd''hui ✨{%- endif -%}'
        icon: mdi:calendar-today
        icon_color: blue
        multiline_secondary: true
        fill_container: false
        layout: horizontal
        tap_action:
          action: navigate
          navigation_path: /maintenance-yaml/calendrier
        card_mod:
          style: 'ha-card { background: rgba(255, 255, 255, 0.30) !important; backdrop-filter: blur(28px) saturate(180%) !important; -webkit-backdrop-filter: blur(28px) saturate(180%) !important; border-radius:
            22px !important; border: 1px solid rgba(255, 255, 255, 0.6) !important; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10) !important; }'
      - type: custom:mushroom-template-card
        entity: sensor.parcel_app_parcel_active_shipment
        primary: '{{ states(entity) | int(0) }}'
        secondary: '{% set n = states(entity) | int(0) %}{% if n == 0 %}Pas de colis en cours{% elif n == 1 %}Colis en livraison{% else %}Colis en livraison{% endif %}'
        icon: mdi:truck-fast
        icon_color: '{% set n = states(entity) | int(0) %}{% if n == 0 %}grey{% elif n < 3 %}blue{% else %}purple{% endif %}'
        layout: horizontal
        fill_container: false
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /maintenance-yaml/colis
        card_mod:
          style: 'ha-card { background: rgba(255, 255, 255, 0.30) !important; backdrop-filter: blur(28px) saturate(180%) !important; -webkit-backdrop-filter: blur(28px) saturate(180%) !important; border-radius:
            22px !important; border: 1px solid rgba(255, 255, 255, 0.6) !important; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10) !important; }'
      - type: custom:mushroom-template-card
        entity: sensor.parcel_app_parcel_active_shipment
        primary: '{{ state_attr(entity,''delivered_today'') | int(0) }}'
        secondary: '{% set n = state_attr(entity,''delivered_today'') | int(0) %}{% if n == 0 %}Aucun livré aujourd''hui{% elif n == 1 %}Colis livré aujourd''hui{% else %}Colis livrés aujourd''hui{% endif
          %}'
        icon: mdi:package-check
        icon_color: '{% set n = state_attr(''sensor.parcel_app_parcel_active_shipment'',''delivered_today'') | int(0) %}{% if n == 0 %}grey{% else %}green{% endif %}'
        layout: horizontal
        fill_container: false
        multiline_secondary: true
        tap_action:
          action: navigate
          navigation_path: /maintenance-yaml/colis
        card_mod:
          style: 'ha-card { background: rgba(255, 255, 255, 0.30) !important; backdrop-filter: blur(28px) saturate(180%) !important; -webkit-backdrop-filter: blur(28px) saturate(180%) !important; border-radius:
            22px !important; border: 1px solid rgba(255, 255, 255, 0.6) !important; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10) !important; }'
    - type: heading
      icon: mdi:lightning-bolt
      heading_style: title
      heading: Électricité
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: horizontal-stack
      cards:
      - type: custom:mushroom-template-card
        layout: horizontal
        entity: sensor.current_tariff_price
        primary: '{{ state_attr(entity,''period'') }} {{ state_attr(entity,''color'') }}'
        secondary: Tarif en cours
        icon: '{% set p = state_attr(entity,''period'') %} {% if p == ''HC'' %}mdi:weather-night{% else %}mdi:weather-sunny{% endif %}'
        icon_color: '{% set c = state_attr(entity,''color'') %} {% if c == ''Bleu'' %}blue{% elif c == ''Blanc'' %}grey{% elif c == ''Rouge'' %}red{% else %}grey{% endif %}'
        tap_action:
          action: more-info
      - type: custom:mushroom-template-card
        layout: horizontal
        entity: sensor.energy_daily_cost
        primary: '{{ states(entity) }} €'
        secondary: Coût aujourd'hui
        icon: mdi:currency-eur
        icon_color: amber
        tap_action:
          action: more-info
    - type: custom:mushroom-chips-card
      alignment: justify
      chips:
      - type: template
        entity: sensor.rte_tempo_prochaine_couleur
        icon: mdi:calendar-tomorrow
        content: 'Demain : {{ states(entity) }}'
        icon_color: '{% if is_state(entity,''Blanc'') %}grey {% elif is_state(entity,''Bleu'') %}blue {% elif is_state(entity,''Rouge'') %}red {% else %}grey{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.rte_tempo_cycle_jours_restants_bleu
        icon: mdi:square
        content: '{{ states(entity) }}j'
        icon_color: blue
        tap_action:
          action: more-info
      - type: template
        entity: sensor.rte_tempo_cycle_jours_restants_blanc
        icon: mdi:square-outline
        content: '{{ states(entity) }}j'
        icon_color: grey
        tap_action:
          action: more-info
      - type: template
        entity: sensor.rte_tempo_cycle_jours_restants_rouge
        icon: mdi:square
        content: '{{ states(entity) }}j'
        icon_color: red
        tap_action:
          action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.lave_vaisselle_current_status
          state:
          - running
          - wash
          - rinse
          - rinsing
          - spin
          - spinning
          - drain
          - prewash
          - soak
          - drying
          - detecting
          - refreshing
          - heat_dry
          - dispense
          - cool_down
          - anti_crease
          - more_dry
          - wrinkle_care
          - steam_softening
          - rinse_hold
        chip:
          type: template
          entity: sensor.lave_vaisselle_current_status
          icon: mdi:dishwasher
          icon_color: blue
          content: '{% set rem = states("sensor.lave_vaisselle_remaining_time") %}{% if rem and rem not in ["unknown","unavailable","none"] %}{% set mins = ((as_timestamp(rem, 0) - as_timestamp(now())) / 60) | round(0) %}{% if mins > 0 %}LV {% if mins >= 60 %}{{ (mins // 60) }}h{{ "%02d" | format(mins % 60) }}{% else %}{{ mins }} min{% endif %}{% else %}LV bientôt fini{% endif %}{% else %}LV en cours{% endif %}'
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.lave_linge_hublot_current_status
          state:
          - running
          - wash
          - rinse
          - rinsing
          - spin
          - spinning
          - drain
          - prewash
          - soak
          - drying
          - detecting
          - refreshing
          - heat_dry
          - dispense
          - cool_down
          - anti_crease
          - more_dry
          - wrinkle_care
          - steam_softening
          - rinse_hold
        chip:
          type: template
          entity: sensor.lave_linge_hublot_current_status
          icon: mdi:washing-machine
          icon_color: indigo
          content: '{% set rem = states("sensor.lave_linge_hublot_remaining_time") %}{% if rem and rem not in ["unknown","unavailable","none"] %}{% set mins = ((as_timestamp(rem, 0) - as_timestamp(now())) / 60) | round(0) %}{% if mins > 0 %}LL {% if mins >= 60 %}{{ (mins // 60) }}h{{ "%02d" | format(mins % 60) }}{% else %}{{ mins }} min{% endif %}{% else %}LL bientôt fini{% endif %}{% else %}LL en cours{% endif %}'
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.seche_linge_current_status
          state:
          - running
          - wash
          - rinse
          - rinsing
          - spin
          - spinning
          - drain
          - prewash
          - soak
          - drying
          - detecting
          - refreshing
          - heat_dry
          - dispense
          - cool_down
          - anti_crease
          - more_dry
          - wrinkle_care
          - steam_softening
          - rinse_hold
        chip:
          type: template
          entity: sensor.seche_linge_current_status
          icon: mdi:tumble-dryer
          icon_color: purple
          content: '{% set rem = states("sensor.seche_linge_remaining_time") %}{% if rem and rem not in ["unknown","unavailable","none"] %}{% set mins = ((as_timestamp(rem, 0) - as_timestamp(now())) / 60) | round(0) %}{% if mins > 0 %}SL {% if mins >= 60 %}{{ (mins // 60) }}h{{ "%02d" | format(mins % 60) }}{% else %}{{ mins }} min{% endif %}{% else %}SL bientôt fini{% endif %}{% else %}SL en cours{% endif %}'
          tap_action:
            action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: sensor.four_machine_state
          state:
          - running
          - operating
        chip:
          type: template
          entity: sensor.four_machine_state
          icon: mdi:stove
          icon_color: '{% set t = states(''sensor.four_temperature'') | float(0) %}{% set sp = states(''sensor.four_set_point'') | float(0) %}{% if t >= sp - 1 %}green{% else %}deep-orange{% endif %}'
          content: '{% set t = states(''sensor.four_temperature'') | float(0) %}{% set sp = states(''sensor.four_set_point'') | float(0) %}{% set rem = states(''sensor.four_completion_time'') %}{% if sp > 0 %}{% if t >= sp - 1 %}Four {{ sp | int }}°C ✓{% else %}Four {{ t | int }}°/{{ sp | int }}°{% endif %}{% if rem and rem not in [''unknown'',''unavailable'',''none''] %}{% set mins = ((as_timestamp(rem, 0) - as_timestamp(now())) / 60) | round(0) %}{% if mins > 0 %} · {{ mins }} min{% endif %}{% endif %}{% else %}Four en marche{% endif %}'
          tap_action:
            action: more-info
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: horizontal-stack
      cards:
      - type: gauge
        entity: sensor.beembox_18562_puissance
        needle: true
        min: 0
        max: 300
        name: Production
        severity:
          green: 200
          yellow: 100
          red: 0
      - type: gauge
        entity: sensor.grid_import
        needle: true
        min: 0
        max: 5000
        name: Import réseau
        severity:
          green: 0
          yellow: 1500
          red: 3000
    - type: heading
      heading: Chambre parentale
      heading_style: title
      icon: mdi:bed-king-outline
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-chips-card
      chips:
      - type: template
        entity: binary_sensor.aqara_presence_multisensor_fp300_occupation_2
        icon: '{% if is_state(entity,''on'') %}mdi:motion-sensor{% else %}mdi:motion-sensor-off{% endif %}'
        icon_color: '{% if is_state(entity,''on'') %}green{% else %}grey{% endif %}'
        content: '{% if is_state(entity,''on'') %}Présence{% elif is_state(entity,''off'') %}Absent{% else %}—{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.weather_station_chambre_temperature
        icon: mdi:thermometer
        content: '{{ states(entity) }}°C'
        icon_color: '{% set v = states(entity) | float(20) %} {% if v < 17 %}blue{% elif v <= 22 %}green{% elif v <= 25 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.weather_station_chambre_humidite
        icon: mdi:water-percent
        content: '{{ states(entity) }}%'
        icon_color: '{% set v = states(entity) | float(50) %} {% if v < 30 %}red{% elif v < 40 %}orange{% elif v <= 60 %}green{% elif v <= 70 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.weather_station_chambre_dioxyde_de_carbone
        icon: mdi:molecule-co2
        content: '{{ states(entity) }} ppm'
        icon_color: '{% set v = states(entity) | float(0) %} {% if v < 1000 %}green{% elif v <= 1500 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: media_player.chambre
          state: playing
        chip:
          type: template
          entity: media_player.chambre
          icon: mdi:speaker
          content: '{{ state_translated(entity) }}'
          icon_color: blue
          tap_action:
            action: more-info
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:auto-entities
      show_empty: false
      card:
        type: custom:mushroom-chips-card
        card_mod:
          style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
      card_param: chips
      filter:
        include:
        - area: chambre
          options:
            type: entity
            icon_color: orange
            content_info: name
          entity_id: '*_ouverture'
    - type: custom:auto-entities
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      entities:
      - type: custom:mushroom-template-card
        entity: humidifier.dual_200s
        primary: Humidificateur
        secondary: '{% if is_state(entity,''on'') %}En marche · {{ state_attr(entity,''mode'')|default('''') }}{% else %}Éteint{% endif %}'
        icon: mdi:air-humidifier
        icon_color: '{{ ''cyan'' if is_state(entity,''on'') else ''grey'' }}'
        tap_action:
          action: perform-action
          perform_action: humidifier.toggle
          target:
            entity_id: humidifier.dual_200s
        layout: horizontal
        fill_container: false
      - type: custom:mushroom-climate-card
        layout: horizontal
        entity: climate.chambre
        name: Radiateur
        hvac_modes:
          - auto
          - heat
        show_temperature_control: true
        collapsible_controls: true
      - type: custom:mushroom-fan-card
        layout: horizontal
        entity: fan.core_200s_series
        name: Purificateur
      - type: tile
        entity: switch.lampe_sel
        name: Lampe sel
        icon: mdi:lamp
      filter:
        include:
        - area: chambre
          domain: light
          options:
            type: custom:mushroom-light-card
            layout: horizontal
            fill_container: false
            use_light_color: true
        exclude:
        - entity_id: '*_dnd'
        - entity_id: light.chambre
      show_empty: false
    - type: heading
      heading: Entrée
      heading_style: title
      icon: mdi:door-closed
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-chips-card
      chips:
      - type: template
        entity: binary_sensor.detecteur_entree_mouvement
        icon: '{% if is_state(entity,''on'') %}mdi:motion-sensor{% else %}mdi:motion-sensor-off{% endif %}'
        icon_color: '{% if is_state(entity,''on'') %}green{% else %}grey{% endif %}'
        content: '{% if is_state(entity,''on'') %}Présence{% elif is_state(entity,''off'') %}Absent{% else %}—{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: lock.smart_lock_pro
        icon: '{% if is_state(entity,''locked'') %}mdi:lock{% else %}mdi:lock-open-variant{% endif %}'
        content: '{{ ''Verrouillée'' if is_state(entity,''locked'') else ''Déverrouillée'' }}'
        icon_color: '{{ ''green'' if is_state(entity,''locked'') else ''red'' }}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.ficus_soil_moisture
        icon: mdi:sprout
        content: '{{ states(entity) }}%'
        icon_color: '{% set v = states(entity) | float(100) %} {% if v < 25 %}red{% elif v < 40 %}orange{% else %}green{% endif %}'
        tap_action:
          action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: binary_sensor.entree_porte_ouverture
          state: 'on'
        chip:
          type: template
          entity: binary_sensor.entree_porte_ouverture
          icon: mdi:door-open
          icon_color: orange
          content: Porte
          tap_action:
            action: more-info
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:auto-entities
      card:
        type: grid
        columns: 2
        square: false
      card_param: cards
      entities:
      - type: custom:mushroom-climate-card
        layout: horizontal
        entity: climate.entree
        name: Radiateur
        hvac_modes:
          - auto
          - heat
        show_temperature_control: true
        collapsible_controls: true
      filter:
        include:
        - area: entree
          domain: light
          options:
            type: custom:mushroom-light-card
            layout: horizontal
            fill_container: false
            use_light_color: true
        exclude:
        - entity_id: '*_dnd'
        - entity_id: light.entree
      show_empty: false
  - type: grid
    cards:
    - type: heading
      heading: Cuisine
      heading_style: title
      icon: mdi:chef-hat
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-chips-card
      chips:
      - type: template
        entity: binary_sensor.aqara_presence_multisensor_fp300_occupation
        icon: '{% if is_state(entity,''on'') %}mdi:motion-sensor{% else %}mdi:motion-sensor-off{% endif %}'
        icon_color: '{% if is_state(entity,''on'') %}green{% else %}grey{% endif %}'
        content: '{% if is_state(entity,''on'') %}Présence{% elif is_state(entity,''off'') %}Absent{% else %}—{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.aqara_presence_multisensor_fp300_temperature
        icon: mdi:thermometer
        content: '{{ states(entity) }}°C'
        icon_color: '{% set v = states(entity) | float(20) %} {% if v < 17 %}blue{% elif v <= 22 %}green{% elif v <= 25 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: number.refrigerateur_fridge_temperature
        icon: mdi:fridge-outline
        content: '{{ states(entity) }}°C'
        icon_color: blue
        tap_action:
          action: more-info
      - type: template
        entity: number.refrigerateur_freezer_temperature
        icon: mdi:snowflake
        content: '{{ states(entity) }}°C'
        icon_color: light-blue
        tap_action:
          action: more-info
      - type: conditional
        conditions:
        - condition: state
          entity: media_player.cuisine
          state: playing
        chip:
          type: template
          entity: media_player.cuisine
          icon: mdi:speaker
          content: '{{ state_translated(entity) }}'
          icon_color: blue
          tap_action:
            action: more-info
      - type: conditional
        conditions: &id001
        - condition: state
          entity: sensor.lave_vaisselle_current_status
          state:
          - running
          - wash
          - rinse
          - spin
          - drain
          - heat_dry
          - dispense
        chip:
          type: template
