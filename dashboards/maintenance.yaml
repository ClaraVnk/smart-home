  background: "linear-gradient(180deg,\n  rgba(251, 191, 36, 0.40) 0%,\n  rgba(244, 114, 182, 0.30) 50%,\n  rgba(167, 139, 250, 0.40) 100%\n) fixed\n"
  type: sections
  max_columns: 2
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: 🐕 Shiva
      heading_style: title
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: grid
      columns: 2
      square: false
      cards:
      - type: custom:mushroom-template-card
        entity: input_datetime.last_shiva_walk
        primary: Dernière sortie
        secondary: '{% set h = ((as_timestamp(now()) - as_timestamp(states(entity))) / 3600) | round(1) %}Il y a {{ h }}h'
        icon: mdi:dog-side
        icon_color: '{% set h = (as_timestamp(now()) - as_timestamp(states(entity))) / 3600 %}{% if h > 8 %}red{% elif h > 6 %}orange{% else %}green{% endif %}'
        layout: vertical
        tap_action:
          action: perform-action
          perform_action: script.shiva_walk_done
          confirmation:
            text: Valider la sortie Shiva ?
      - type: custom:mushroom-template-card
        entity: input_datetime.task_shiva_ears
        primary: Oreilles Shiva
        secondary: '{% set d = states(entity) %}{% if d %}Dernière : {{ as_timestamp(d) | timestamp_custom(''%d %b'', true) }}{% else %}—{% endif %}'
        icon: mdi:ear-hearing
        icon_color: '{{ ''red'' if is_state(''binary_sensor.task_shiva_ears_due'',''on'') else ''green'' }}'
        layout: vertical
        tap_action:
          action: perform-action
          perform_action: script.validate_task_shiva_ears
          confirmation:
            text: Valider le nettoyage des oreilles ?
  - type: grid
    cards:
    - type: heading
      heading: 🐈 Hadès
      heading_style: title
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
