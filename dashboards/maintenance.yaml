      secondary: '{% set d = states(entity) %}{% if d %}Dernière : {{ as_timestamp(d) | timestamp_custom(''%d %b'', true) }}{% else %}—{% endif %}'
      icon: mdi:cat
      icon_color: '{{ ''red'' if is_state(''binary_sensor.task_litiere_due'',''on'') else ''green'' }}'
      layout: horizontal
      tap_action:
        action: perform-action
        perform_action: script.validate_task_litiere
        confirmation:
          text: Valider le nettoyage de la litière ?
  - type: grid
    cards:
    - type: heading
      heading: 🥣 Gamelle Shiva (distributeur Aqara)
