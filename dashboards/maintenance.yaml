title: Maintenance
views:
- title: À faire
  path: todo
  icon: mdi:checkbox-marked-circle-outline
  theme: home_glass
  background: "linear-gradient(180deg,\n  rgba(134, 239, 172, 0.50) 0%,\n  rgba(165, 243, 252, 0.40) 50%,\n  rgba(147, 197, 253, 0.50) 100%\n) fixed\n"
  type: sections
  max_columns: 2
  sections:
  - type: grid
    cards:
    - type: heading
      heading: État
      heading_style: title
      icon: mdi:bell-ring-outline
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-template-card
      entity: sensor.maintenance_actions
      primary: '{% set n = states(''sensor.maintenance_actions'') | int(0) %} {{ n }} action{{ ''s'' if n > 1 else '''' }}'
      secondary: '{% set n = states(''sensor.maintenance_actions'') | int(0) %} {% set urgent = is_state_attr(''sensor.maintenance_actions'',''urgent'',true) %} {% if urgent %}🚨 urgences détectées {% elif
        n == 0 %}Tout est en ordre {% else %}à traiter{% endif %}'
      icon: '{% if is_state_attr(''sensor.maintenance_actions'',''urgent'',true) %}mdi:alert-octagram {% elif states(''sensor.maintenance_actions'') | int(0) > 0 %}mdi:format-list-checks {% else %}mdi:check-circle-outline{%
        endif %}'
      icon_color: '{% set urgent = is_state_attr(''sensor.maintenance_actions'',''urgent'',true) %} {% set n = states(''sensor.maintenance_actions'') | int(0) %} {% if urgent %}red{% elif n > 0 %}orange{%
        else %}green{% endif %}'
      tap_action:
        action: none
  - type: grid
    cards:
    - type: heading
      heading: Énergie aujourd'hui
      heading_style: title
      icon: mdi:lightning-bolt
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-chips-card
      alignment: justify
      chips:
      - type: template
        entity: sensor.current_tariff_price
        icon: '{% set p = state_attr(entity,''period'') %} {% if p == ''HC'' %}mdi:weather-night{% else %}mdi:weather-sunny{% endif %}'
        content: '{{ state_attr(entity,''period'') }} {{ state_attr(entity,''color'') }}'
        icon_color: '{% set c = state_attr(entity,''color'') %} {% if c == ''Bleu'' %}blue{% elif c == ''Blanc'' %}grey{% elif c == ''Rouge'' %}red{% else %}grey{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.energy_daily_cost
        icon: mdi:currency-eur
        content: '{{ states(entity) }} €'
        icon_color: '{% set v = states(entity) | float(0) %} {% if v < 2 %}green{% elif v < 5 %}orange{% else %}red{% endif %}'
        tap_action:
          action: more-info
      - type: template
        entity: sensor.current_tariff_price
        icon: '{% set period = state_attr(entity,''period'') %} {% set color = state_attr(entity,''color'') %} {% if period == ''HC'' %}mdi:check-circle {% elif color == ''Rouge'' %}mdi:close-circle {%
          else %}mdi:alert-circle{% endif %}'
        content: '{% set period = state_attr(entity,''period'') %} {% set color = state_attr(entity,''color'') %} {% if period == ''HC'' %}Bon moment {% elif color == ''Rouge'' %}À éviter {% else %}Normal{%
          endif %}'
        icon_color: '{% set period = state_attr(entity,''period'') %} {% set color = state_attr(entity,''color'') %} {% if period == ''HC'' %}green {% elif color == ''Rouge'' %}red {% else %}orange{% endif
          %}'
        tap_action:
          action: more-info
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
  - type: grid
    cards:
    - type: heading
      heading: Actions à faire
      heading_style: title
      icon: mdi:format-list-checks
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:auto-entities
      show_empty: false
      card:
        type: vertical-stack
      card_param: cards
      filter:
        template: "{% set items = state_attr('sensor.maintenance_actions','items') or [] %} {% set urgent = is_state_attr('sensor.maintenance_actions','urgent', true) %} {% set ns = namespace(out=[]) %}\
          \ {% for it in items %}\n  {% set ns.out = ns.out + [{\n    'type': 'custom:mushroom-template-card',\n    'entity': it.entity,\n    'primary': it.name,\n    'secondary': '',\n    'icon': it.icon,\n\
          \    'icon_color': 'red' if urgent else 'orange',\n    'layout': 'horizontal',\n    'fill_container': false,\n    'tap_action': {'action': 'more-info'}\n  }] %}\n{% endfor %} {{ ns.out }}"
    - type: conditional
      conditions:
      - condition: numeric_state
        entity: sensor.maintenance_actions
        below: 1
      card:
        type: markdown
        content: '✅ **Tout est en ordre.**

          '
  - type: grid
    cards:
    - type: heading
      heading: Tâches récurrentes
      heading_style: title
      icon: mdi:calendar-check
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_clean_humidifier_due
      primary: Nettoyer humidificateur
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:water
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_clean_humidifier
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_robot_mop_filter_due
      primary: Serpillère + filtre robot
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:broom
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_robot_mop_filter
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_clean_pet_fountain_due
      primary: Fontaine animaux
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:cup-water
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_clean_pet_fountain
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_clean_dishwasher_due
      primary: Nettoyer lave-vaisselle
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:dishwasher
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_clean_dishwasher
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_clean_washer_due
      primary: Nettoyer machine à laver
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:washing-machine
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_clean_washer
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_litiere_due
      primary: Litière chat
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:cat
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_litiere
    - type: custom:mushroom-template-card
      entity: binary_sensor.task_shiva_ears_due
      primary: Oreilles Shiva
      secondary: '{{ ''À faire'' if is_state(entity,''on'') else ''OK'' }}'
      icon: mdi:dog
      icon_color: '{{ ''red'' if is_state(entity,''on'') else ''green'' }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: script.validate_task_shiva_ears
    - type: custom:mushroom-template-card
      entity: input_boolean.lave_vaisselle_sel
      primary: Sel lave-vaisselle
      secondary: '{{ "À remplir" if is_state(entity,"on") else "OK" }}'
      icon: mdi:shaker-outline
      icon_color: '{{ "red" if is_state(entity,"on") else "green" }}'
      layout: horizontal
      fill_container: false
      tap_action:
        action: perform-action
        perform_action: input_boolean.turn_off
        target:
          entity_id: input_boolean.lave_vaisselle_sel
  - type: grid
    cards:
    - type: heading
      heading: Détecteurs
      heading_style: title
      icon: mdi:shield-check-outline
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-entity-card
      entity: binary_sensor.detecteur_de_fumee_fumee
      name: Fumée
      icon: mdi:smoke-detector-variant
      icon_color: '{{ ''red'' if is_state(''binary_sensor.detecteur_de_fumee_fumee'',''on'') else ''green'' }}'
    - type: custom:mushroom-entity-card
      entity: binary_sensor.fuite_evier
      name: Fuite évier
      icon: mdi:water
      icon_color: '{{ ''red'' if is_state(''binary_sensor.fuite_evier'',''on'') else ''green'' }}'
    - type: custom:mushroom-entity-card
      entity: binary_sensor.fuite_baignoire
      name: Fuite baignoire
      icon: mdi:water
      icon_color: '{{ ''red'' if is_state(''binary_sensor.fuite_baignoire'',''on'') else ''green'' }}'
    - type: custom:mushroom-entity-card
      entity: binary_sensor.fuite_machine_a_laver
      name: Fuite machine à laver
      icon: mdi:water
      icon_color: '{{ ''red'' if is_state(''binary_sensor.fuite_machine_a_laver'',''on'') else ''green'' }}'
  - type: grid
    cards:
    - type: heading
      heading: Électroménager
      heading_style: title
      icon: mdi:dishwasher
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-entity-card
      entity: sensor.lave_vaisselle_current_status
      name: Lave-vaisselle
      icon: mdi:dishwasher
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: sensor.lave_linge_hublot_current_status
      name: Lave-linge
      icon: mdi:washing-machine
      secondary_info: state
    - type: custom:mushroom-entity-card
      entity: sensor.seche_linge_current_status
      name: Sèche-linge
      icon: mdi:tumble-dryer
      secondary_info: state
  - type: grid
    cards:
    - type: heading
      heading: Consommables
      heading_style: title
      icon: mdi:archive-outline
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-template-card
      entity: sensor.core_300s_filter_lifetime
      primary: Filtre purificateur salon
      secondary: '{{ states(entity) }}% restant'
      icon: mdi:air-filter
      icon_color: '{% set v = states(entity) | int(0) %} {% if v < 15 %}red{% elif v < 30 %}orange{% else %}green{% endif %}'
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.core_200s_series_filter_lifetime
      primary: Filtre purificateur chambre
      secondary: '{{ states(entity) }}% restant'
      icon: mdi:air-filter
      icon_color: '{% set v = states(entity) | int(0) %} {% if v < 15 %}red{% elif v < 30 %}orange{% else %}green{% endif %}'
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.refrigerateur_water_filter
      primary: Filtre eau frigo
      secondary: '{% set s = states(entity) %} {% set used = states(''sensor.refrigerateur_water_filter_used'') %} {% if s == ''replace'' %}À remplacer{% else %}OK — {{ used }} mois{% endif %}'
      icon: mdi:water-pump
      icon_color: '{% if is_state(entity,''replace'') %}red{% else %}green{% endif %}'
      tap_action:
        action: more-info
  - type: grid
    cards:
    - type: heading
      heading: Robot aspirateur
      heading_style: title
      icon: mdi:robot-vacuum
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_temps_restant_filtre
      primary: Filtre
      secondary: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}À remplacer — tap pour reset {% elif s < 86400 %}{{ (s / 3600) | int }} h restantes {% else %}{{ (s / 86400) | round(1) }} j restants{% endif %}'
      icon: mdi:air-filter
      icon_color: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}red{% elif s < 7*86400 %}orange{% else %}green{% endif %}'
      tap_action:
        action: perform-action
        perform_action: vacuum.send_command
        target:
          entity_id: vacuum.s8_pro_ultra
        data:
          command: reset_consumable
          params:
            - filter_work_time
        confirmation:
          text: Réinitialiser le compteur filtre (après remplacement) ?
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_temps_restant_brosse_principale
      primary: Brosse principale
      secondary: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}À remplacer — tap pour reset {% elif s < 86400 %}{{ (s / 3600) | int }} h restantes {% else %}{{ (s / 86400) | round(1) }} j restants{% endif %}'
      icon: mdi:broom
      icon_color: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}red{% elif s < 7*86400 %}orange{% else %}green{% endif %}'
      tap_action:
        action: perform-action
        perform_action: vacuum.send_command
        target:
          entity_id: vacuum.s8_pro_ultra
        data:
          command: reset_consumable
          params:
            - main_brush_work_time
        confirmation:
          text: Réinitialiser le compteur brosse principale ?
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_temps_restant_brosse_laterale
      primary: Brosse latérale
      secondary: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}À remplacer — tap pour reset {% elif s < 86400 %}{{ (s / 3600) | int }} h restantes {% else %}{{ (s / 86400) | round(1) }} j restants{% endif %}'
      icon: mdi:broom
      icon_color: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}red{% elif s < 7*86400 %}orange{% else %}green{% endif %}'
      tap_action:
        action: perform-action
        perform_action: vacuum.send_command
        target:
          entity_id: vacuum.s8_pro_ultra
        data:
          command: reset_consumable
          params:
            - side_brush_work_time
        confirmation:
          text: Réinitialiser le compteur brosse latérale ?
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_temps_restant_capteurs
      primary: Capteurs (nettoyer)
      secondary: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}À nettoyer — tap pour reset {% elif s < 86400 %}{{ (s / 3600) | int }} h restantes {% else %}{{ (s / 86400) | round(1) }} j restants{% endif %}'
      icon: mdi:eye-circle-outline
      icon_color: '{% set s = states(entity) | int(0) %} {% if s <= 0 %}red{% elif s < 7*86400 %}orange{% else %}green{% endif %}'
      tap_action:
        action: perform-action
        perform_action: vacuum.send_command
        target:
          entity_id: vacuum.s8_pro_ultra
        data:
          command: reset_consumable
          params:
            - sensor_dirty_time
        confirmation:
          text: Réinitialiser le compteur capteurs (après nettoyage) ?
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_dock_strainer_time_left
      primary: Filtre dock
      secondary: '{% set h = states(entity) | int(0) %} {% if h <= 0 %}À remplacer {% elif h < 24 %}{{ h }} h restantes {% else %}{{ (h / 24) | round(1) }} j restants{% endif %}'
      icon: mdi:filter-variant
      icon_color: '{% set h = states(entity) | int(0) %} {% if h <= 0 %}red{% elif h < 24*7 %}orange{% else %}green{% endif %}'
      tap_action:
        action: more-info
    - type: custom:mushroom-template-card
      entity: sensor.s8_pro_ultra_dock_maintenance_brush_time_left
      primary: Brosse dock
      secondary: '{% set h = states(entity) | int(0) %} {% if h <= 0 %}À nettoyer {% elif h < 24 %}{{ h }} h restantes {% else %}{{ (h / 24) | round(1) }} j restants{% endif %}'
      icon: mdi:broom
      icon_color: '{% set h = states(entity) | int(0) %} {% if h <= 0 %}red{% elif h < 24*7 %}orange{% else %}green{% endif %}'
      tap_action:
        action: more-info
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.s8_pro_ultra_dock_clean_water_box
        state: 'on'
      card:
        type: custom:mushroom-chips-card
        chips:
        - type: template
          entity: binary_sensor.s8_pro_ultra_dock_clean_water_box
          icon: mdi:water
          content: Eau propre à remplir
          icon_color: red
          tap_action:
            action: more-info
        card_mod:
          style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.s8_pro_ultra_dock_dirty_water_box
        state: 'on'
      card:
        type: custom:mushroom-chips-card
        chips:
        - type: template
          entity: binary_sensor.s8_pro_ultra_dock_dirty_water_box
          icon: mdi:water-off
          content: Eau sale à vider
          icon_color: red
          tap_action:
            action: more-info
        card_mod:
          style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.s8_pro_ultra_dock_cleaning_fluid
        state: 'on'
      card:
        type: custom:mushroom-chips-card
        chips:
        - type: template
          entity: binary_sensor.s8_pro_ultra_dock_cleaning_fluid
          icon: mdi:bottle-tonic
          content: Détergent à remplir
          icon_color: red
          tap_action:
            action: more-info
        card_mod:
          style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: conditional
      conditions:
      - condition: state
        entity: binary_sensor.s8_pro_ultra_penurie_d_eau
        state: 'on'
      card:
        type: custom:mushroom-chips-card
        chips:
        - type: template
          entity: binary_sensor.s8_pro_ultra_penurie_d_eau
          icon: mdi:water-alert
          content: Pénurie d'eau
          icon_color: red
          tap_action:
            action: more-info
        card_mod:
          style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
  - type: grid
    cards:
    - type: heading
      heading: Plantes
      heading_style: title
      icon: mdi:flower
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: horizontal-stack
      cards:
      - type: gauge
        entity: sensor.ficus_soil_moisture
        name: Ficus
        min: 0
        max: 100
        severity:
          red: 0
          yellow: 25
          green: 40
      - type: gauge
        entity: sensor.dragonnier_de_madagascar_soil_moisture
        name: Dragonnier
        min: 0
        max: 100
        severity:
          red: 0
          yellow: 25
          green: 40
  - type: grid
    cards:
    - type: heading
      heading: Devices hors ligne
      heading_style: title
      icon: mdi:lan-disconnect
      card_mod:
        style: 'ha-card { background: transparent !important; box-shadow: none !important; border: none !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }'
    - type: custom:auto-entities
      show_empty: false
      card:
        type: entities
        show_header_toggle: false
        state_color: false
      filter:
        include:
        - domain: light
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: switch
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: climate
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: cover
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: vacuum
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: media_player
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: lock
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: fan
          state: unavailable
          options:
            secondary_info: last-changed
        - domain: camera
          state: unavailable
          options:
            secondary_info: last-changed
        exclude:
        - entity_id: /.*iphone.*/
        - entity_id: /.*watch.*/
        - entity_id: /.*synchroniser.*/
        - entity_id: /.*inverser.*/
        - entity_id: /.*preservation.*/
        - entity_id: /.*remplacement.*/
        - entity_id: /.*liste_de_lecture.*/
        - entity_id: /.*palette.*/
        - entity_id: /.*prereglage.*/
        - entity_id: /.*veilleuse.*/
        - entity_id: /.*comportement.*/
        - entity_id: /.*intensite.*/
        - entity_id: /.*vitesse.*/
        - entity_id: /.*sapin_noel.*/
        - entity_id: /switch\.bouilloire_.*/
        - entity_id: /select\.wled_.*/
        - entity_id: /.*lave_vaisselle.*/
        - entity_id: /.*lave_linge.*/
        - entity_id: /.*machine_a_laver.*/
        - entity_id: media_player.g4_instant
        - entity_id: camera.prusa_mk4s_previsualisation
        - entity_id: /sonoff_1001364e3c.*/
        - entity_id: /.*seche_linge.*/
        - entity_id: /switch\.wled_.*/
        - entity_id: /number\.wled_.*/
        - entity_id: /button\..*/
        - attributes:
            entity_category: diagnostic
        - attributes:
            entity_category: config
      sort:
        method: last_changed
        reverse: true
- title: Calendrier
  path: calendrier
