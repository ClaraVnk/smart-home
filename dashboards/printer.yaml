        card_mod:
          style: 'ha-card { background: rgba(255, 255, 255, 0.30) !important; backdrop-filter: blur(28px) saturate(180%) !important; -webkit-backdrop-filter: blur(28px) saturate(180%) !important; border-radius: 22px !important; border: 1px solid rgba(255, 255, 255, 0.6) !important; box-shadow: 0 8px 32px rgba(31, 38, 135, 0.10) !important; }'
      - type: custom:mushroom-template-card
        entity: button.a1mini_0300da610200644_reprise
