# Compense l'écart entre la température mesurée par le Daikin et celle du salon.
# Le user voit une seule consigne (input_number.salon_target_temperature) ;
# l'automation ajuste périodiquement le setpoint Daikin pour atteindre
# T_salon = consigne. Source de vérité : sensor.weather_station_temperature.

input_number:
  salon_target_temperature:
    name: Salon - consigne température
    icon: mdi:thermometer
    min: 16
    max: 26
    step: 0.5
    initial: 20
    unit_of_measurement: "°C"
    mode: box

